<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AX: AI와 협업하는 미래 | AX Consulting Basic Guide</title>
<style>
/* =========================================================
   0. RESET & DESIGN TOKENS
   ========================================================= */
*,*::before,*::after{box-sizing:border-box;}
:root{
  --blue:#034EA2;
  --blue-dark:#002B66;
  --green:#78BE20;
  --white:#FFFFFF;
  --gray-900:#1B2733;
  --gray-700:#3E4C5A;
  --gray-600:#5A6B7A;
  --gray-500:#6B7785;
  --gray-400:#98A3AE;
  --gray-300:#C7CFD8;
  --gray-100:#EEF1F5;
  --gray-050:#F7F9FB;
  --border:#E1E7EE;
  --shadow:0 2px 10px rgba(3,78,162,0.07),0 14px 34px rgba(0,43,102,0.06);
  --radius:14px;
  --sidebar-w:280px;
  --font:'Malgun Gothic','Apple SD Gothic Neo',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}
html,body{height:100%;}
body{
  margin:0;
  font-family:var(--font);
  font-size:12pt;
  font-weight:500;
  color:var(--gray-900);
  background:var(--white);
  word-break:keep-all;
  overflow-wrap:break-word;
}
button{font-family:inherit;}
ul{list-style:none;margin:0;padding:0;}

/* =========================================================
   1. APP SHELL — Flexbox 2-Column Layout
   ========================================================= */
#app{
  display:flex;
  flex-direction:row;
  width:100%;
  height:100vh;
  min-height:560px;
  background:var(--white);
  overflow:hidden;
}

/* ---------- Sidebar (agenda) : fixed 280px (~18%) ---------- */
#sidebar{
  --sb-bg:#0f172a;
  --sb-text:#f8fafc;
  --sb-muted:rgba(255,255,255,0.62);
  --sb-faint:rgba(255,255,255,0.38);
  --sb-hover:rgba(255,255,255,0.08);
  --sb-surface:rgba(255,255,255,0.06);
  --sb-line:rgba(255,255,255,0.12);
  flex:0 0 var(--sidebar-w);
  width:var(--sidebar-w);
  max-width:30%;
  height:100%;
  background:var(--sb-bg);
  color:var(--sb-text);
  border-right:1px solid var(--sb-line);
  display:flex;
  flex-direction:column;
  padding:22px 18px;
  overflow:hidden;
}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:22px;}
.brand-mark{
  width:38px;height:38px;border-radius:9px;flex:0 0 auto;
  background:var(--blue);color:#fff;font-weight:800;font-size:12pt;
  display:flex;align-items:center;justify-content:center;
}
.brand-text{display:flex;flex-direction:column;line-height:1.35;}
.brand-text strong{font-size:11.5pt;color:var(--sb-text);letter-spacing:.01em;}
.brand-text span{font-size:9.5pt;color:var(--sb-muted);}

.progress-panel{
  background:var(--sb-surface);
  border:1px solid var(--sb-line);
  border-radius:10px;
  padding:14px 14px 12px;
  margin-bottom:20px;
}
.progress-top{
  display:flex;justify-content:space-between;align-items:baseline;
  font-size:10pt;color:var(--sb-muted);margin-bottom:8px;
}
#progressPercent{font-size:13pt;font-weight:800;color:var(--sb-text);}
.progress-track{
  width:100%;height:8px;background:rgba(255,255,255,0.12);border-radius:5px;overflow:hidden;
}
.progress-fill{
  height:100%;width:0%;background:var(--green);
  border-radius:5px;transition:width .25s ease;
}
.progress-count{margin-top:8px;font-size:9.5pt;color:var(--sb-faint);}

.sidebar-nav{
  flex:1;display:flex;flex-direction:column;gap:4px;overflow-y:auto;
}
.nav-item{
  display:flex;align-items:center;gap:10px;
  width:100%;text-align:left;
  background:transparent;border:1px solid transparent;border-radius:9px;
  padding:9px 10px;cursor:pointer;color:var(--sb-muted);
}
.nav-item:hover{background:var(--sb-hover);color:var(--sb-text);}
.nav-no{
  flex:0 0 auto;width:22px;height:22px;border-radius:6px;
  background:rgba(255,255,255,0.12);color:var(--sb-text);font-weight:700;font-size:9.5pt;
  display:flex;align-items:center;justify-content:center;
}
.nav-label{font-size:10.5pt;line-height:1.4;}
.nav-item.is-active{background:var(--blue);border-color:var(--blue);color:#fff;}
.nav-item.is-active .nav-label{color:#fff;font-weight:700;}
.nav-item.is-active .nav-no{background:var(--green);color:#fff;}
.nav-item.is-edge{color:var(--sb-faint);font-size:10pt;}
.nav-item.is-edge.is-active{background:var(--blue-dark);color:#fff;}
.nav-item:focus-visible,.stage-arrow:focus-visible{outline:3px solid var(--green);outline-offset:2px;}

.sidebar-home-list{
  flex:0 0 auto;
  margin-top:10px;
  padding-top:10px;
  border-top:1px solid var(--sb-line);
}
.sidebar-home{
  display:flex;align-items:center;gap:10px;
  width:100%;
  padding:9px 10px;
  border-radius:9px;
  color:var(--sb-text);
  font-size:10.5pt;
  font-weight:700;
  text-decoration:none;
}
.sidebar-home:hover{background:var(--sb-hover);}
.sidebar-home:focus-visible{outline:3px solid var(--green);outline-offset:2px;}
.sidebar-home .nav-no{
  background:transparent;
  color:var(--sb-text);
  font-size:12pt;
}

.sidebar-footer{
  margin-top:14px;padding-top:14px;border-top:1px solid var(--sb-line);
  font-size:9pt;color:var(--sb-faint);line-height:1.5;
}

/* ---------- Main stage ---------- */
#stage{
  flex:1;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:clamp(14px,3vh,36px) 70px;
  background:var(--white);
  cursor:pointer;
  overflow:hidden;
}
.slide-viewport{width:100%;max-width:1180px;height:100%;display:flex;align-items:center;justify-content:center;}
.slide-card{
  position:relative;
  width:100%;
  height:100%;
  overflow-y:auto;
  background:var(--white);
  border:1px solid var(--border);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:clamp(22px,4vh,44px) clamp(28px,4vw,52px) clamp(14px,2vh,26px);
  display:flex;flex-direction:column;
  animation:fadeIn .28s ease;
}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
@media (prefers-reduced-motion:reduce){.slide-card{animation:none;}}

/* 15인치 노트북 대표 해상도(1366x768 / 1440x900)의 실제 브라우저 뷰포트 높이(약 650~820px)에서
   슬라이드가 스크롤 없이 한 화면에 들어오도록 세로 여백·타이포그래피를 축소 */
@media (max-height:820px){
  .slide-eyebrow{margin-bottom:6px;}
  .slide-title{font-size:19pt;}
  .slide-lead{margin-top:10px;padding:9px 13px;gap:4px;}
  .lead-line{font-size:10.6pt;}
  .slide-body{gap:14px;margin-top:16px;}
  .block-heading{margin-bottom:7px;}
  .slide-footer{margin-top:12px;padding-top:10px;}
  .steps-grid{gap:10px;}
  .step-item{padding:12px;gap:9px;}
  .step-title{font-size:11.5pt;}
  .step-desc{font-size:10pt;}
  .compare-grid{gap:12px;}
  .compare-col-body{padding:10px 13px;gap:7px;}
  .cover-title{font-size:27pt;}
  .section-titleKr{font-size:22pt;margin-top:5px;}
  .section-previews{margin-top:12px;gap:7px;}
  .closing-lead{font-size:18pt;}
  .closing-title{font-size:13pt;}
}
@media (max-height:700px){
  .slide-title{font-size:16.5pt;}
  .slide-body{gap:10px;margin-top:12px;}
  .step-item{padding:9px;}
  .step-title{font-size:10.8pt;}
  .step-desc{font-size:9.6pt;}
  .stat-value{font-size:20pt;}
  .cover-title{font-size:22pt;}
  .section-titleKr{font-size:18pt;}
  .closing-lead{font-size:16pt;}
  .closing-title{font-size:12pt;}
}

.slide-card.is-compact{overflow:hidden;}
.slide-card.is-compact .slide-body{
  flex:1;min-height:0;gap:10px;margin-top:14px;
}
.slide-card.is-compact .slide-body .block:first-child{
  flex:1;min-height:0;display:flex;flex-direction:column;
}
.slide-card.is-compact .steps-grid{
  flex:1;min-height:0;height:100%;gap:8px;grid-auto-rows:1fr;
}
.slide-card.is-compact .step-item{
  padding:8px 14px;min-height:0;align-items:center;
}
.slide-card.is-compact .note-box{padding:10px 14px;}
.slide-card.is-compact .slide-footer{margin-top:12px;padding-top:10px;}

.stage-arrow{
  position:absolute;top:50%;transform:translateY(-50%);
  width:42px;height:42px;border-radius:50%;
  background:var(--white);border:1px solid var(--border);
  color:var(--blue);font-size:18pt;line-height:1;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 8px rgba(0,43,102,0.1);
  z-index:5;
}
.stage-arrow:hover{background:var(--blue);color:#fff;border-color:var(--blue);}
.stage-arrow.prev{left:16px;}
.stage-arrow.next{right:16px;}

.stage-hint{
  position:absolute;left:0;right:0;bottom:10px;
  text-align:center;font-size:9.5pt;color:var(--gray-400);
  pointer-events:none;letter-spacing:.01em;
}

/* =========================================================
   2. SLIDE CONTENT TYPOGRAPHY
   ========================================================= */
.slide-eyebrow{font-size:11pt;font-weight:700;color:var(--blue);margin-bottom:8px;}
.slide-title{font-size:23pt;font-weight:800;color:var(--blue-dark);line-height:1.35;margin:0;}
.slide-lead{
  margin-top:14px;display:flex;flex-direction:column;gap:6px;
  padding:12px 16px;border-left:3px solid var(--blue);background:var(--gray-050);border-radius:0 8px 8px 0;
}
.lead-line{font-size:11.5pt;color:var(--gray-700);line-height:1.7;padding-left:2px;}
.lead-line.is-bold{font-weight:700;color:var(--blue-dark);}
.slide-body{flex:1;display:flex;flex-direction:column;gap:20px;margin-top:22px;}
.block-heading{font-size:12.5pt;font-weight:700;color:var(--blue-dark);margin-bottom:10px;}
.block-heading.is-green{color:var(--green);}
.slide-footer{
  margin-top:20px;padding-top:14px;border-top:1px solid var(--border);
  display:flex;justify-content:space-between;align-items:center;
  font-size:9.5pt;color:var(--gray-500);
}
.footer-dot{margin:0 6px;color:var(--gray-300);}

/* ---------- steps / cards grid ---------- */
.steps-grid{display:grid;grid-template-columns:repeat(var(--cols,3),1fr);gap:14px;}
.step-item{
  display:flex;gap:12px;align-items:stretch;
  background:var(--gray-050);border:1px solid var(--border);border-radius:10px;padding:16px;
}
.step-item.is-accent{background:#F5FAEC;border-color:var(--green);}
.step-num{
  flex:0 0 auto;width:28px;height:28px;border-radius:50%;
  background:var(--blue);color:#fff;font-weight:700;font-size:11pt;
  display:flex;align-items:center;justify-content:center;
}
.step-num.is-tag{border-radius:6px;width:auto;padding:4px 9px;font-size:9.5pt;white-space:nowrap;align-self:flex-start;}
.step-item.is-accent .step-num{background:var(--green);}
.step-content{display:flex;flex-direction:column;gap:5px;min-width:0;flex:1;}
.step-title{font-size:12.5pt;font-weight:700;color:var(--blue-dark);line-height:1.4;}
.step-sub2{font-size:9.5pt;color:var(--gray-500);font-weight:600;}
.step-desc{font-size:10.8pt;color:var(--gray-700);line-height:1.6;}
.step-desc.is-bold{font-weight:700;color:var(--gray-800);}
.step-desc ul{margin:2px 0 0 0;padding:0;display:flex;flex-direction:column;gap:3px;}
.step-desc ul li{padding-left:13px;position:relative;}
.step-desc ul li::before{content:'';position:absolute;left:0;top:8px;width:4px;height:4px;border-radius:50%;background:var(--blue);}
/* 43페이지(로드맵) 전용: 글머리표 문단의 매달린 들여쓰기 제거, 줄바꿈된 다음 줄도 왼쪽 끝에 맞춤 */
.step-desc.no-hang ul li{padding-left:0;position:static;}
.step-desc.no-hang ul li::before{position:static;display:inline-block;margin-right:7px;vertical-align:middle;}
.step-badge{align-self:flex-start;background:var(--green);color:#fff;font-size:9pt;font-weight:700;padding:2px 10px;border-radius:999px;}
.step-note{
  font-size:9.8pt;color:var(--blue-dark);background:#EAF1FA;border-left:3px solid var(--blue);
  padding:8px 9px;border-radius:6px;line-height:1.5;
  margin-top:auto;min-height:96px;
  display:flex;align-items:center;
}
.step-note-inner{width:100%;}
.step-footer-tag{font-size:9.5pt;font-weight:700;color:var(--blue);margin-top:2px;}
.step-item.is-stack{flex-direction:column;gap:10px;}
.step-item.is-stack .step-head{display:flex;align-items:flex-start;gap:10px;}
.step-item.is-stack .step-head-text{display:flex;flex-direction:column;gap:4px;min-width:0;}
.step-item.is-stack .step-desc{margin:0;}
.step-item.is-stack .step-desc ul{margin:0;}

/* ---------- table ---------- */
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:10px;}
table.data-table{width:100%;border-collapse:collapse;font-size:10.5pt;}
table.data-table th{background:var(--blue);color:#fff;text-align:left;padding:10px 12px;font-weight:700;font-size:10pt;}
table.data-table td{padding:10px 12px;border-bottom:1px solid var(--border);color:var(--gray-700);vertical-align:top;}
table.data-table tr:last-child td{border-bottom:none;}
table.data-table tr:nth-child(even) td{background:var(--gray-050);}
.table-footnote{margin-top:10px;font-size:10.3pt;color:var(--blue-dark);font-weight:600;line-height:1.6;}

/* ---------- compare (N-column panels) ---------- */
.compare-grid{display:grid;grid-template-columns:repeat(var(--cols,2),1fr);gap:16px;}
.compare-col{border:1px solid var(--border);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;}
.compare-col-head{padding:11px 15px;font-weight:700;font-size:11.5pt;color:#fff;background:var(--blue);}
.compare-col[data-tone="darkblue"] .compare-col-head{background:var(--blue-dark);}
.compare-col[data-tone="green"] .compare-col-head{background:var(--green);}
.compare-col[data-tone="gray"] .compare-col-head{background:var(--gray-600);}
.compare-col-sub{display:block;font-size:9.3pt;font-weight:500;opacity:.85;margin-top:2px;}
.compare-col-body{padding:13px 15px;display:flex;flex-direction:column;gap:9px;flex:1;}
.compare-item{font-size:10.8pt;color:var(--gray-700);line-height:1.6;padding-left:13px;position:relative;}
.compare-item::before{content:'';position:absolute;left:0;top:8px;width:5px;height:5px;border-radius:50%;background:var(--blue);}
.compare-col[data-tone="gray"] .compare-item::before{background:var(--gray-500);}
.compare-item-titled{padding-left:0;}
.compare-item-titled::before{display:none;}
.ci-title{font-weight:700;color:var(--blue-dark);font-size:10.8pt;margin-bottom:2px;}
.ci-desc{font-size:10.5pt;color:var(--gray-700);line-height:1.6;}
.compare-item .ci-inline-title{font-weight:700;color:var(--blue-dark);}
.bullets-list{display:flex;flex-direction:column;gap:9px;}

/* ---------- myth / fact ---------- */
.mythfact-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 20px;}
.mythfact-head{font-weight:700;font-size:11.5pt;padding-bottom:9px;border-bottom:2px solid var(--border);margin-bottom:10px;}
.mythfact-head.myth{color:var(--gray-500);}
.mythfact-head.fact{color:var(--blue);}
.myth-item,.fact-item{display:flex;gap:8px;padding:9px 0;border-bottom:1px dashed var(--border);font-size:10.8pt;line-height:1.55;}
.myth-item{color:var(--gray-600);}
.fact-item{color:var(--blue-dark);font-weight:500;}
.myth-item .icon{color:var(--gray-400);font-weight:800;flex:0 0 auto;}
.fact-item .icon{color:var(--green);font-weight:800;flex:0 0 auto;}

/* ---------- AS-IS / TO-BE transition ---------- */
.transition-row{display:flex;align-items:center;justify-content:center;gap:22px;padding:14px 0;flex-wrap:wrap;}
.transition-box{flex:1;min-width:200px;max-width:340px;border-radius:12px;padding:22px;text-align:center;}
.transition-box.from{background:var(--gray-050);border:1px solid var(--border);}
.transition-box.to{background:#F5FAEC;border:2px solid var(--green);}
.transition-label{font-size:10pt;font-weight:700;letter-spacing:.03em;color:var(--gray-500);margin-bottom:8px;}
.transition-box.to .transition-label{color:var(--green);}
.transition-value{font-size:13.5pt;font-weight:700;color:var(--blue-dark);line-height:1.5;}
.transition-arrow{font-size:22pt;color:var(--blue);font-weight:700;}

/* ---------- flow (process) ---------- */
.flow-row{display:flex;align-items:stretch;gap:0;flex-wrap:wrap;justify-content:center;row-gap:10px;}
.flow-step{flex:1;min-width:130px;background:var(--gray-050);border:1px solid var(--border);border-radius:10px;padding:14px 10px;text-align:center;}
.flow-title{font-weight:700;color:var(--blue-dark);font-size:11pt;}
.flow-desc{font-size:9.8pt;color:var(--gray-600);margin-top:4px;line-height:1.5;}
.flow-arrow{display:flex;align-items:center;justify-content:center;padding:0 8px;color:var(--blue);font-size:15pt;font-weight:700;}
.flow-footnote{margin-top:12px;}

/* Multi-row flow (equal-size grid cells, arrows only between nodes on the same row) */
.flow-grid{
  display:grid;
  grid-template-columns:repeat(var(--flowcols,3),minmax(0,176px));
  justify-content:center;
  column-gap:44px;
  row-gap:26px;
}
.flow-grid-step{
  position:relative;background:var(--gray-050);border:1px solid var(--border);border-radius:10px;
  padding:14px 12px;text-align:center;min-height:80px;
  display:flex;flex-direction:column;justify-content:center;
}
.flow-grid-step .flow-title{font-weight:700;color:var(--blue-dark);font-size:11pt;}
.flow-grid-step .flow-desc{font-size:9.8pt;color:var(--gray-600);margin-top:4px;line-height:1.5;}
.flow-grid-step:not(:last-child)::after{
  content:'→';position:absolute;top:50%;right:-44px;width:44px;
  transform:translateY(-50%);text-align:center;
  color:var(--blue);font-size:15pt;font-weight:700;
}
.flow-grid[data-cols="3"] .flow-grid-step:nth-child(3n)::after{content:none;}
.flow-grid[data-cols="2"] .flow-grid-step:nth-child(2n)::after{content:none;}
.flow-grid[data-cols="4"] .flow-grid-step:nth-child(4n)::after{content:none;}

/* ---------- stat grid ---------- */
.statgrid-row{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;}
.stat-card{flex:1;min-width:220px;max-width:320px;text-align:center;background:var(--gray-050);border:1px solid var(--border);border-radius:12px;padding:22px 18px;}
.stat-value{font-size:26pt;font-weight:800;color:var(--blue);}
.stat-label{font-size:11.5pt;font-weight:700;color:var(--blue-dark);margin-top:6px;}
.stat-sub{font-size:9.8pt;color:var(--gray-500);margin-top:4px;}

/* ---------- architecture flow ---------- */
.archflow-list{display:flex;flex-direction:column;gap:14px;}
.arch-item{border:1px solid var(--border);border-radius:10px;padding:15px 17px;}
.arch-label{font-weight:700;color:var(--blue-dark);font-size:11.5pt;margin-bottom:10px;}
.arch-flow{display:flex;flex-direction:column;gap:6px;margin-bottom:8px;max-width:420px;}
.arch-node{background:var(--gray-050);border:1px solid var(--border);padding:8px 12px;border-radius:6px;font-size:10.3pt;color:var(--gray-700);}
.arch-node:first-child{background:var(--blue);color:#fff;font-weight:700;border-color:var(--blue);}
.arch-desc{font-size:10.3pt;color:var(--gray-600);line-height:1.55;}

/* ---------- bar list ---------- */
.barlist{display:flex;flex-direction:column;gap:11px;}
.bar-row{display:flex;align-items:center;gap:12px;}
.bar-label{width:190px;flex:0 0 auto;font-size:10.5pt;font-weight:600;color:var(--gray-700);}
.bar-track{flex:1;background:var(--gray-100);border-radius:6px;height:13px;overflow:hidden;}
.bar-fill{height:100%;background:linear-gradient(90deg,var(--blue),var(--blue-dark));border-radius:6px;}
.bar-value{width:48px;text-align:right;font-weight:700;color:var(--blue-dark);font-size:10.5pt;}

/* ---------- note / quote ---------- */
.note-box{background:#EAF1FA;border-left:4px solid var(--blue);border-radius:8px;padding:13px 15px;font-size:10.8pt;color:var(--blue-dark);font-weight:500;line-height:1.6;}
.note-box.is-green{background:#F5FAEC;border-left-color:var(--green);font-weight:700;}
.quote-box{text-align:center;padding:20px 10px;}
.quote-text{font-size:19pt;font-weight:800;color:var(--blue-dark);position:relative;display:inline-block;}
.quote-text::after{content:'';display:block;width:56px;height:4px;background:var(--green);margin:12px auto 0;border-radius:2px;}

   ========================================================= */
function esc(v){
  return String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function joinDesc(desc, bulletless){
  if(Array.isArray(desc)){
    if(bulletless){
      return desc.map(esc).join('<br>');
    }
    return '<ul>'+desc.map(function(d){return '<li>'+esc(d)+'</li>';}).join('')+'</ul>';
  }
  return esc(desc);
}

function renderStepsBlock(b){
  var cols = b.cols || 3;
  var itemsHtml = b.items.map(function(it){
    var numHtml = '';
    if(it.num){
      var isTag = String(it.num).length > 3;
      numHtml = '<div class="step-num'+(isTag?' is-tag':'')+'">'+esc(it.num)+'</div>';
    }
    var titleHtml = it.title ? '<div class="step-title">'+esc(it.title)+'</div>' : '';
    var sub2Html = it.sub2 ? '<div class="step-sub2">'+esc(it.sub2)+'</div>' : '';
    var descHtml = it.desc ? '<div class="step-desc'+(b.flatBullets?' no-hang':'')+(b.boldDesc?' is-bold':'')+'">'+joinDesc(it.desc, it.bulletless)+'</div>' : '';
    var badgeHtml = it.badge ? '<div class="step-badge">'+esc(it.badge)+'</div>' : '';
    var noteHtml = '';
    if(it.sub){
      noteHtml = (typeof it.sub === 'object')
        ? '<div class="step-note"><div class="step-note-inner"><strong>'+esc(it.sub.label)+'</strong><br>'+esc(it.sub.text)+'</div></div>'
        : '<div class="step-note"><div class="step-note-inner">'+esc(it.sub)+'</div></div>';
    }
    var footerHtml = it.footer ? '<div class="step-footer-tag">'+esc(it.footer)+'</div>' : '';
    var toneCls = it.tone === 'accent' ? ' is-accent' : '';
    if(b.flatBullets){
      return '<div class="step-item is-stack'+toneCls+'">'+
        '<div class="step-head">'+numHtml+'<div class="step-head-text">'+titleHtml+sub2Html+'</div></div>'+
        descHtml+badgeHtml+noteHtml+footerHtml+'</div>';
    }
    return '<div class="step-item'+toneCls+'">'+numHtml+
      '<div class="step-content">'+titleHtml+sub2Html+descHtml+badgeHtml+noteHtml+footerHtml+'</div></div>';
  }).join('');
  return '<div class="steps-grid" style="--cols:'+cols+'">'+itemsHtml+'</div>';
}

function renderTableBlock(b){
  var thead = '<tr>'+b.headers.map(function(h){return '<th>'+esc(h)+'</th>';}).join('')+'</tr>';
  var tbody = b.rows.map(function(r){
    return '<tr>'+r.map(function(c){
      if(Array.isArray(c)){ return '<td>'+c.map(esc).join('<br>')+'</td>'; }
      return '<td>'+esc(c)+'</td>';
    }).join('')+'</tr>';
  }).join('');
  var footnote = b.footnote ? '<div class="table-footnote">'+esc(b.footnote)+'</div>' : '';
  return '<div class="table-wrap"><table class="data-table"><thead>'+thead+'</thead><tbody>'+tbody+'</tbody></table></div>'+footnote;
}

function renderCompareBlock(b){
  var cols = b.columns.length;
  var colsHtml = b.columns.map(function(col){
    var sub = col.subtitle ? '<span class="compare-col-sub">'+esc(col.subtitle)+'</span>' : '';
    var items = col.items.map(function(i){
      if(typeof i === 'object'){
        return '<div class="compare-item compare-item-titled"><div class="ci-title">'+esc(i.title)+'</div><div class="ci-desc">'+esc(i.desc)+'</div></div>';
      }
      var parts = String(i).match(/^(.+?)\s:\s([\s\S]+)$/);
      if(parts){
        return '<div class="compare-item"><span class="ci-inline-title">'+esc(parts[1])+'</span> : '+esc(parts[2])+'</div>';
      }
      return '<div class="compare-item">'+esc(i)+'</div>';
    }).join('');
    return '<div class="compare-col" data-tone="'+(col.tone||'blue')+'">'+
      '<div class="compare-col-head">'+esc(col.title)+sub+'</div>'+
      '<div class="compare-col-body">'+items+'</div></div>';
  }).join('');
  return '<div class="compare-grid" style="--cols:'+cols+'">'+colsHtml+'</div>';
}

function renderMythfactBlock(b){
  var mythCol = '<div class="mythfact-col"><div class="mythfact-head myth">'+esc(b.leftLabel)+'</div>'+
    b.pairs.map(function(p){return '<div class="myth-item"><span class="icon">✕</span><span>'+esc(p.myth)+'</span></div>';}).join('')+'</div>';
  var factCol = '<div class="mythfact-col"><div class="mythfact-head fact">'+esc(b.rightLabel)+'</div>'+
    b.pairs.map(function(p){return '<div class="fact-item"><span class="icon">✓</span><span>'+esc(p.fact)+'</span></div>';}).join('')+'</div>';
  return '<div class="mythfact-grid">'+mythCol+factCol+'</div>';
}

function renderTransitionBlock(b){
  return '<div class="transition-row">'+
    '<div class="transition-box from"><div class="transition-label">'+esc(b.from.label)+'</div><div class="transition-value">'+esc(b.from.value)+'</div></div>'+
    '<div class="transition-arrow">→</div>'+
    '<div class="transition-box to"><div class="transition-label">'+esc(b.to.label)+'</div><div class="transition-value">'+esc(b.to.value)+'</div></div>'+
    '</div>';
}

function renderFlowBlock(b){
  var stepsHtml = b.stages.map(function(s, idx){
    var node = '<div class="flow-step"><div class="flow-title">'+esc(s.title)+'</div>'+
      (s.desc ? '<div class="flow-desc">'+esc(s.desc)+'</div>' : '')+'</div>';
    if(idx < b.stages.length - 1){ node += '<div class="flow-arrow">→</div>'; }
    return node;
  }).join('');
  var footnote = b.footnote ? '<div class="table-footnote flow-footnote">'+esc(b.footnote)+'</div>' : '';
  return '<div class="flow-row">'+stepsHtml+'</div>'+footnote;
}

function renderFlowGridBlock(b){
  var cols = b.perRow;
  var itemsHtml = b.stages.map(function(s){
    return '<div class="flow-grid-step"><div class="flow-title">'+esc(s.title)+'</div>'+
      (s.desc ? '<div class="flow-desc">'+esc(s.desc)+'</div>' : '')+'</div>';
  }).join('');
  var footnote = b.footnote ? '<div class="table-footnote flow-footnote">'+esc(b.footnote)+'</div>' : '';
  return '<div class="flow-grid" data-cols="'+cols+'" style="--flowcols:'+cols+'">'+itemsHtml+'</div>'+footnote;
}

function renderStatgridBlock(b){
  var itemsHtml = b.items.map(function(i){
    return '<div class="stat-card"><div class="stat-value">'+esc(i.value)+'</div>'+
      '<div class="stat-label">'+esc(i.label)+'</div>'+
      (i.sub ? '<div class="stat-sub">'+esc(i.sub)+'</div>' : '')+'</div>';
  }).join('');
  var footnote = b.footnote ? '<div class="note-box" style="margin-top:14px">'+esc(b.footnote)+'</div>' : '';
  return '<div class="statgrid-row">'+itemsHtml+'</div>'+footnote;
}

function renderArchflowBlock(b){
  var itemsHtml = b.items.map(function(it){
    var flowHtml = it.flow.map(function(f){ return '<div class="arch-node">'+esc(f)+'</div>'; }).join('');
    var descHtml = it.desc ? '<div class="arch-desc">'+esc(it.desc)+'</div>' : '';
    return '<div class="arch-item"><div class="arch-label">'+esc(it.label)+'</div><div class="arch-flow">'+flowHtml+'</div>'+descHtml+'</div>';
  }).join('');
  return '<div class="archflow-list">'+itemsHtml+'</div>';
}

function renderBarlistBlock(b){
  var itemsHtml = b.items.map(function(i){
    return '<div class="bar-row"><div class="bar-label">'+esc(i.label)+'</div>'+
      '<div class="bar-track"><div class="bar-fill" style="width:'+i.value+'%"></div></div>'+
      '<div class="bar-value">'+Number(i.value).toFixed(1)+'%</div></div>';
  }).join('');
  return '<div class="barlist">'+itemsHtml+'</div>';
}

function renderNoteBlock(b){
  var content = Array.isArray(b.text) ? b.text.map(esc).join('<br>') : esc(b.text);
  var cls = 'note-box' + (b.tone === 'green' ? ' is-green' : '');
  return '<div class="'+cls+'">'+content+'</div>';
}
function renderQuoteBlock(b){ return '<div class="quote-box"><div class="quote-text">'+esc(b.text)+'</div></div>'; }
function renderBulletsBlock(b){
  var itemsHtml = b.items.map(function(i){ return '<div class="compare-item">'+esc(i)+'</div>'; }).join('');
  return '<div class="bullets-list">'+itemsHtml+'</div>';
}

function renderBlock(b){
  var inner = '';
  switch(b.type){
    case 'steps': inner = renderStepsBlock(b); break;
    case 'table': inner = renderTableBlock(b); break;
    case 'compare': inner = renderCompareBlock(b); break;
    case 'mythfact': inner = renderMythfactBlock(b); break;
    case 'transition': inner = renderTransitionBlock(b); break;
    case 'flow': inner = b.perRow ? renderFlowGridBlock(b) : renderFlowBlock(b); break;
    case 'statgrid': inner = renderStatgridBlock(b); break;
    case 'archflow': inner = renderArchflowBlock(b); break;
    case 'barlist': inner = renderBarlistBlock(b); break;
    case 'note': inner = renderNoteBlock(b); break;
    case 'quote': inner = renderQuoteBlock(b); break;
    case 'bullets': inner = renderBulletsBlock(b); break;
    default: inner = '';
  }
  var heading = b.heading ? '<div class="block-heading'+(b.headingTone === 'green' ? ' is-green' : '')+'">'+esc(b.heading)+'</div>' : '';
  return '<div class="block">'+heading+inner+'</div>';
}

function footerTemplate(slide, num){
  var brand = slide.brand || 'AX: AI와 협업하는 미래';
  var tag = slide.tag ? '<span class="footer-dot">·</span><span>'+esc(slide.tag)+'</span>' : '';
  return '<div class="slide-footer"><div class="footer-left"><span>'+esc(brand)+'</span>'+tag+'</div>'+
    '<div class="footer-right">'+num+' / '+TOTAL+'</div></div>';
}

function contentTemplate(slide, num){
  var eyebrow = slide.eyebrow ? '<div class="slide-eyebrow">'+esc(slide.eyebrow)+'</div>' : '';
  var title = '<h2 class="slide-title">'+esc(slide.title)+'</h2>';
  var lead = '';
  if(slide.lead){
    var lines = Array.isArray(slide.lead) ? slide.lead : [slide.lead];
    lead = '<div class="slide-lead">'+lines.map(function(l){
      if(typeof l === 'object'){
        return '<div class="lead-line'+(l.bold?' is-bold':'')+'">'+esc(l.text)+'</div>';
      }
      return '<div class="lead-line">'+esc(l)+'</div>';
    }).join('')+'</div>';
  }
  var body = '<div class="slide-body">'+(slide.blocks||[]).map(renderBlock).join('')+'</div>';
  return eyebrow+title+lead+body+footerTemplate(slide, num);
}

function coverTemplate(slide){
  var descHtml = slide.descLines.map(function(d){return '<div class="cover-desc">'+esc(d)+'</div>';}).join('');
  return '<div class="cover-layout">'+
    '<div class="cover-kicker">'+esc(slide.kicker)+'</div>'+
    '<h1 class="cover-title">'+esc(slide.title)+'</h1>'+
    '<div class="cover-subtitle">'+esc(slide.subtitle)+'</div>'+
    descHtml+
    '<div class="cover-footer">'+esc(slide.footer)+'</div>'+
    '</div>';
}

function sectionTemplate(slide, num){
  var previewsHtml = slide.previews.map(function(p){
    return '<div class="section-preview-item"><span class="dot"></span><span>'+esc(p)+'</span></div>';
  }).join('');
  return '<div class="section-layout">'+
    '<div class="section-part">'+esc(slide.eyebrow)+'</div>'+
    '<div class="section-titleEn">'+esc(slide.titleEn)+'</div>'+
    '<div class="section-titleKr">'+esc(slide.titleKr)+'</div>'+
    '<div class="section-previews">'+previewsHtml+'</div>'+
    '</div>'+footerTemplate(slide, num);
}

function closingTemplate(slide){
  return '<div class="closing-layout">'+
    '<div class="closing-lead">'+joinDesc(slide.lead, true)+'</div>'+
    '<div class="closing-title">'+esc(slide.big)+'</div>'+
    '<div class="closing-footer">'+esc(slide.footer)+'</div>'+
    '</div>';
}

function slideTemplate(slide, num){
  switch(slide.layout){
    case 'cover': return coverTemplate(slide);
    case 'section': return sectionTemplate(slide, num);
    case 'closing': return closingTemplate(slide);
    default: return contentTemplate(slide, num);
  }
}

/* =========================================================
   SECTION E. RENDER / NAVIGATION
   ========================================================= */
function renderNav(){
  dom.sidebarNav.innerHTML = NAV.map(function(n){
    return '<button type="button" class="nav-item'+(n.edge?' is-edge':'')+'" data-action="goto" data-slide="'+n.slide+'">'+
      (n.no ? '<span class="nav-no">'+n.no+'</span>' : '')+
      '<span class="nav-label">'+esc(n.label)+'</span></button>';
  }).join('');
}

function updateNavActive(){
  var buttons = dom.sidebarNav.querySelectorAll('.nav-item');
  for(var i=0;i<NAV.length;i++){
    var n = NAV[i];
    var active = n.range ? (current >= n.range[0] && current <= n.range[1]) : (current === n.slide);
    buttons[i].classList.toggle('is-active', active);
  }
}

function updateProgress(){
  var pct = Math.round((current / TOTAL) * 100);
  dom.progressFill.style.width = pct + '%';
  dom.progressPercent.textContent = pct + '%';
  dom.progressCount.textContent = current + ' / ' + TOTAL + ' 페이지';
}

function updateHint(){
  if(current >= TOTAL){
    dom.stageHint.textContent = '마지막 페이지입니다 · 클릭하면 처음으로 돌아갑니다';
  } else {
    dom.stageHint.textContent = '화면을 클릭하면 다음 슬라이드로 이동합니다  (←  →  키보드 가능)';
  }
}

function render(){
  var slide = SLIDES[current - 1];
  dom.slideViewport.innerHTML = '<div class="slide-card'+(slide.compact?' is-compact':'')+'">' + slideTemplate(slide, current) + '</div>';
  var card = dom.slideViewport.querySelector('.slide-card');
  if(card){ card.scrollTop = 0; }
  updateProgress();
  updateNavActive();
  updateHint();
}

function goTo(n){
  n = Math.max(1, Math.min(TOTAL, n));
  if(n === current) return;
  current = n;
  render();
}
function next(){ if(current >= TOTAL){ goTo(1); } else { goTo(current + 1); } }
function prev(){ goTo(Math.max(1, current - 1)); }

/* =========================================================
   SECTION F. EVENTS (delegation + explicit propagation control)
   ========================================================= */
function bindEvents(){
  /* Sidebar: single delegated listener for all nav buttons */
  dom.sidebarNav.addEventListener('click', function(e){
    var btn = e.target.closest('[data-action="goto"]');
    if(!btn) return;
    e.stopPropagation();
    goTo(parseInt(btn.getAttribute('data-slide'), 10));
  });

  /* Sidebar: arrow-key list navigation (↑/↓ for the vertical desktop list,
     ←/→ also supported for the horizontal mobile layout). Moving focus
     immediately jumps to that slide, like a tab list. Scoped to the sidebar
     and stopped from bubbling so it never collides with the global
     ArrowLeft/ArrowRight slide-advance shortcut below. */
  dom.sidebarNav.addEventListener('keydown', function(e){
    var moveKeys = ['ArrowDown','ArrowRight','ArrowUp','ArrowLeft','Home','End'];
    if(moveKeys.indexOf(e.key) === -1) return;
    var buttons = Array.prototype.slice.call(dom.sidebarNav.querySelectorAll('.nav-item'));
    if(!buttons.length) return;
    var idx = buttons.indexOf(document.activeElement);
    if(idx === -1) idx = 0;
    e.preventDefault();
    e.stopPropagation();
    var targetIdx = idx;
    if(e.key === 'ArrowDown' || e.key === 'ArrowRight'){ targetIdx = (idx + 1) % buttons.length; }
    else if(e.key === 'ArrowUp' || e.key === 'ArrowLeft'){ targetIdx = (idx - 1 + buttons.length) % buttons.length; }
    else if(e.key === 'Home'){ targetIdx = 0; }
    else if(e.key === 'End'){ targetIdx = buttons.length - 1; }
    buttons[targetIdx].focus();
    goTo(parseInt(buttons[targetIdx].getAttribute('data-slide'), 10));
  });

  /* Stage: single delegated listener handles prev/next buttons AND the
     "click anywhere to advance" behaviour, using closest() + stopPropagation
     to avoid the same click being processed twice. */
  dom.stage.addEventListener('click', function(e){
    var navBtn = e.target.closest('[data-action="prev"],[data-action="next"]');
    if(navBtn){
      e.stopPropagation();
      var action = navBtn.getAttribute('data-action');
      if(action === 'prev'){ prev(); } else { next(); }
      return;
    }
    next();
  });

  /* Keyboard navigation */
  document.addEventListener('keydown', function(e){
    if(e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown'){
      e.preventDefault(); next();
    } else if(e.key === 'ArrowLeft' || e.key === 'PageUp'){
      e.preventDefault(); prev();
    } else if(e.key === 'Home'){
      e.preventDefault(); goTo(1);
    } else if(e.key === 'End'){
      e.preventDefault(); goTo(TOTAL);
    }
  });
}

/* =========================================================
   SECTION G. INIT
   ========================================================= */
function init(){
  cacheDom();
  renderNav();
  bindEvents();
  render();
}

document.addEventListener('DOMContentLoaded', init);
</script>
