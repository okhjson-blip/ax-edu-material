<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2026년 상반기 AX 컨설팅 과제 관리 대시보드</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;

      /* 과제 유형별 차별화 컬러 팔레트 */
      --type-macro-bg: #fef3c7;
      --type-macro-txt: #92400e;
      --type-macro-bd: #fde68a;

      --type-rpa-bg: #e0e7ff;
      --type-rpa-txt: #3730a3;
      --type-rpa-bd: #c7d2fe;

      --type-chatbot-bg: #dcfce7;
      --type-chatbot-txt: #166534;
      --type-chatbot-bd: #bbf7d0;

      --type-app-bg: #e0f2fe;
      --type-app-txt: #0369a1;
      --type-app-bd: #bae6fd;

      --type-vision-bg: #fae8ff;
      --type-vision-txt: #86198f;
      --type-vision-bd: #f5d0fe;

      --type-agent-bg: #fee2e2;
      --type-agent-txt: #991b1b;
      --type-agent-bd: #fecaca;

      --type-default-bg: #f1f5f9;
      --type-default-txt: #475569;
      --type-default-bd: #cbd5e1;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 14px 18px;
      line-height: 1.4;
      font-size: 13px;
    }

    /* 15인치 노트북(1366px~1536px) 해상도 최적화 컨테이너 */
    .container {
      max-width: 1440px;
      margin: 0 auto;
    }

    /* Header */
    header {
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .title-area h1 {
      font-size: 18px;
      font-weight: 700;
      color: #0f172a;
      letter-spacing: -0.3px;
    }

    .title-area p {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .stats-badge {
      background: var(--card-bg);
      padding: 5px 12px;
      border-radius: 6px;
      border: 1px solid var(--border);
      font-size: 12.5px;
      font-weight: 600;
      box-shadow: 0 1px 2px rgba(0,0,0,0.03);
    }

    .stats-badge span {
      color: var(--primary);
    }

    /* Filter Card */
    .filter-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 14px;
      margin-bottom: 12px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.03);
    }

    .filter-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 8px;
      margin-bottom: 10px;
    }

    .filter-group {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .filter-group label {
      font-size: 11.5px;
      font-weight: 600;
      color: #475569;
    }

    select, input[type="text"] {
      padding: 5px 8px;
      font-size: 12px;
      border: 1px solid var(--border);
      border-radius: 5px;
      background-color: #fff;
      color: var(--text);
      outline: none;
      transition: all 0.15s ease;
      width: 100%;
      height: 30px;
    }

    select:focus, input[type="text"]:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.12);
    }

    .search-row {
      display: flex;
      gap: 8px;
      padding-top: 8px;
      border-top: 1px dashed var(--border);
      align-items: flex-end;
    }

    .search-group {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .btn {
      height: 30px;
      padding: 0 14px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 5px;
      cursor: pointer;
      border: none;
      transition: background 0.15s ease;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .btn-secondary {
      background: #f1f5f9;
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      background: #e2e8f0;
    }

    /* Table Container */
    .table-container {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 1px 2px rgba(0,0,0,0.03);
    }

    .table-responsive {
      width: 100%;
      overflow-x: auto;
      max-height: calc(100vh - 250px);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 12.5px;
    }

    thead th {
      background: #f1f5f9;
      color: #334155;
      font-weight: 600;
      padding: 8px 10px;
      border-bottom: 1px solid #cbd5e1;
      white-space: nowrap;
      position: relative;
      overflow: hidden;
    }

    tbody tr {
      border-bottom: 1px solid var(--border);
      transition: background 0.1s ease;
    }

    tbody tr:hover {
      background: #f8fafc;
    }

    td {
      padding: 7px 10px;
      vertical-align: middle;
      color: #334155;
    }

    .col-no {
      width: 42px;
      text-align: center;
      color: var(--text-muted);
      font-size: 11.5px;
    }

    .col-l1, .col-l2, .col-l3 {
      white-space: nowrap;
      font-weight: 500;
    }

    .col-l4 {
      white-space: nowrap;
      font-weight: 700;
      color: #0f172a;
      background: #f0f9ff;
    }

    .col-desc {
      min-width: 260px;
      line-height: 1.45;
      color: #475569;
    }

    .col-purpose {
      white-space: nowrap;
    }

    /* Column resize */
    thead th {
      position: sticky;
      top: 0;
      z-index: 2;
      user-select: none;
    }

    .th-resizer {
      position: absolute;
      right: 0;
      top: 0;
      bottom: 0;
      width: 5px;
      cursor: col-resize;
      background: transparent;
    }

    .th-resizer:hover,
    .th-resizer.active {
      background: var(--primary);
      opacity: 0.4;
    }

    /* Type Badge Tags (과제 유형 전용) */
    .tag-type {
      display: inline-block;
      padding: 2px 7px;
      border-radius: 4px;
      font-size: 11.5px;
      font-weight: 600;
      white-space: nowrap;
    }

    .type-macro {
      background: var(--type-macro-bg);
      color: var(--type-macro-txt);
      border: 1px solid var(--type-macro-bd);
    }

    .type-rpa {
      background: var(--type-rpa-bg);
      color: var(--type-rpa-txt);
      border: 1px solid var(--type-rpa-bd);
    }

    .type-chatbot {
      background: var(--type-chatbot-bg);
      color: var(--type-chatbot-txt);
      border: 1px solid var(--type-chatbot-bd);
    }

    .type-app {
      background: var(--type-app-bg);
      color: var(--type-app-txt);
      border: 1px solid var(--type-app-bd);
    }

    .type-vision {
      background: var(--type-vision-bg);
      color: var(--type-vision-txt);
      border: 1px solid var(--type-vision-bd);
    }

    .type-agent {
      background: var(--type-agent-bg);
      color: var(--type-agent-txt);
      border: 1px solid var(--type-agent-bd);
    }

    .type-default {
      background: var(--type-default-bg);
      color: var(--type-default-txt);
      border: 1px solid var(--type-default-bd);
    }

    /* Empty State */
    .empty-state {
      padding: 36px 16px;
      text-align: center;
      color: var(--text-muted);
      font-size: 13px;
    }

    @media (max-width: 1100px) {
      .filter-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }
  </style>
</head>

          </select>
        </div>
        <div class="filter-group">
          <label for="filter-purpose">과제 목적</label>
          <select id="filter-purpose" onchange="applyFilters()">
            <option value="">전체</option>
          </select>
        </div>
      </div>

      <!-- Keyword Search Filters -->
      <div class="search-row">
        <div class="search-group">
          <label for="search-title">과제명 검색</label>
          <input type="text" id="search-title" placeholder="과제명 키워드 입력 (Enter 지원)" onkeydown="handleKeyDown(event)">
        </div>
        <div class="search-group">
          <label for="search-desc">과제 주요내용 검색</label>
          <input type="text" id="search-desc" placeholder="주요내용 키워드 입력 (Enter 지원)" onkeydown="handleKeyDown(event)">
        </div>
        <div style="display: flex; gap: 6px;">
          <button class="btn btn-primary" onclick="applyFilters()">검색</button>
          <button class="btn btn-secondary" onclick="resetFilters()">초기화</button>
        </div>
      </div>
    </div>

          </thead>
          <tbody id="task-tbody">

        </table>
      </div>
      <div id="empty-state" class="empty-state" style="display: none;">
        조건에 일치하는 과제가 없습니다.
      </div>
    </div>
  </div>

      {no: 209, title: "신규 모델 BOM 자동 통합", desc: "여러 형식의 BOM(자재명세서) 파일을 수작업으로 통합하던 프로세스를 VBA 매크로를 통해 자동화", type: "1) 매크로", purpose: "운영 및 프로세스 자동화", l1: "연구개발", l2: "개발관리", l3: "BOM·개발정보 관리", l4: "신규 모델 BOM 자동 통합"},
      {no: 210, title: "SW 통합 현황 시스템 「SW Town」", desc: "Jira, Redmine, 캘린더, 메신저 등에 흩어져 있던 SW개발실의 7가지 현황(프로젝트, 개인업무, 근무상태, 이슈, 세미나, 공지, 식단)을 단일 플랫폼으로 통합하여 가시화, AI 챗봇(NC Talk) 도입", type: "4) 앱/시스템", purpose: "플랫폼 및 자산화", l1: "연구개발", l2: "S/W 개발", l3: "SW 개발현황 관리", l4: "SW 통합 현황 시스템 「SW Town」"}
    ];

    // 과제 유형별 CSS 태그 클래스 매핑
    function getTypeClass(typeStr) {
      if (!typeStr) return 'type-default';
      if (typeStr.indexOf('매크로') !== -1) return 'type-macro';
      if (typeStr.indexOf('RPA') !== -1) return 'type-rpa';
      if (typeStr.indexOf('챗봇') !== -1) return 'type-chatbot';
      if (typeStr.indexOf('Vision') !== -1) return 'type-vision';
      if (typeStr.indexOf('Agent') !== -1) return 'type-agent';
      if (typeStr.indexOf('앱/시스템') !== -1) return 'type-app';
      return 'type-default';
    }

    // 드롭다운 옵션 자동 채우기
    function populateDropdowns() {
      var keys = [
        { id: 'filter-l1', key: 'l1' },
        { id: 'filter-l2', key: 'l2' },
        { id: 'filter-l3', key: 'l3' },
        { id: 'filter-l4', key: 'l4' },
        { id: 'filter-type', key: 'type' },
        { id: 'filter-purpose', key: 'purpose' }
      ];

      keys.forEach(function(item) {
        var select = document.getElementById(item.id);
        if (!select) return;

        var set = {};
        rawData.forEach(function(row) {
          var val = row[item.key];
          if (val) set[val] = true;
        });

        var sortedVals = Object.keys(set).sort();
        sortedVals.forEach(function(val) {
          var opt = document.createElement('option');
          opt.value = val;
          opt.textContent = val;
          select.appendChild(opt);
        });
      });

      var totalEl = document.getElementById('total-count');
      if (totalEl) totalEl.textContent = rawData.length;
    }

    // HTML 특수문자 이스케이프 (안전한 테이블 렌더링)
    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    // 테이블 렌더링
    function renderTable(data) {
      var tbody = document.getElementById('task-tbody');
      var emptyState = document.getElementById('empty-state');
      var filteredCountEl = document.getElementById('filtered-count');

      if (!tbody) return;
      tbody.innerHTML = '';

      if (filteredCountEl) filteredCountEl.textContent = data.length;

      if (data.length === 0) {
        if (emptyState) emptyState.style.display = 'block';
        return;
      }
      if (emptyState) emptyState.style.display = 'none';

      var fragment = document.createDocumentFragment();
      data.forEach(function(item) {
        var tr = document.createElement('tr');
        var typeClass = getTypeClass(item.type);

        tr.innerHTML = 
          '<td class="col-no">' + item.no + '</td>' +
          '<td class="col-l1">' + escapeHtml(item.l1 || '-') + '</td>' +
          '<td class="col-l2">' + escapeHtml(item.l2 || '-') + '</td>' +
          '<td class="col-l3">' + escapeHtml(item.l3 || '-') + '</td>' +
          '<td class="col-l4">' + escapeHtml(item.l4 || '-') + '</td>' +
          '<td class="col-desc">' + formatDesc(item.desc) + '</td>' +
          '<td><span class="tag-type ' + typeClass + '">' + escapeHtml(item.type) + '</span></td>' +
          '<td class="col-purpose">' + escapeHtml(item.purpose || '-') + '</td>';

        fragment.appendChild(tr);
      });

      tbody.appendChild(fragment);
    }

    // 필터링 실행
    function applyFilters() {
      var l1 = document.getElementById('filter-l1').value;
      var l2 = document.getElementById('filter-l2').value;
      var l3 = document.getElementById('filter-l3').value;
      var l4 = document.getElementById('filter-l4').value;
      var type = document.getElementById('filter-type').value;
      var purpose = document.getElementById('filter-purpose').value;

      var titleSearch = document.getElementById('search-title').value.trim().toLowerCase();
      var descSearch = document.getElementById('search-desc').value.trim().toLowerCase();

      var filtered = rawData.filter(function(item) {
        if (l1 && item.l1 !== l1) return false;
        if (l2 && item.l2 !== l2) return false;
        if (l3 && item.l3 !== l3) return false;
        if (l4 && item.l4 !== l4) return false;
        if (type && item.type !== type) return false;
        if (purpose && item.purpose !== purpose) return false;

        if (titleSearch && item.title.toLowerCase().indexOf(titleSearch) === -1) return false;
        if (descSearch && item.desc.toLowerCase().indexOf(descSearch) === -1) return false;

        return true;
      });

      renderTable(filtered);
    }

    // 엔터키 입력 처리
    function handleKeyDown(e) {
      if (e.key === 'Enter') {
        applyFilters();
      }
    }

    // 필터 초기화
    function resetFilters() {
      document.getElementById('filter-l1').value = '';
      document.getElementById('filter-l2').value = '';
      document.getElementById('filter-l3').value = '';
      document.getElementById('filter-l4').value = '';
      document.getElementById('filter-type').value = '';
      document.getElementById('filter-purpose').value = '';
      document.getElementById('search-title').value = '';
      document.getElementById('search-desc').value = '';
      renderTable(rawData);
    }

    // 과제 주요내용을 한국어 의미 단위로 줄바꿈
    function formatDesc(str) {
      if (!str) return '';
      var safe = escapeHtml(str);
      // 의미 구분자: ~하고, ~하여, ~하며, ~통해, ~위해, ~및, ~등을, ~으로, 쉼표 뒤
      safe = safe.replace(/(,\s*|하고\s|하여\s|으로써\s|통해\s|위해\s|으로\s전환|으로\s개선|시스템으로\s|자동으로\s|형태로\s)/g, '$1<br>');
      // 길면 주요 접속사/조사 뒤에서도 분리
      safe = safe.replace(/(\s및\s)/g, '$1<br>');
      return safe;
    }

    // 컬럼 너비 드래그 리사이즈
    function initColumnResize() {
      var ths = document.querySelectorAll('thead th');
      ths.forEach(function(th) {
        var resizer = document.createElement('div');
        resizer.className = 'th-resizer';
        th.appendChild(resizer);
        var startX, startW;
        resizer.addEventListener('mousedown', function(e) {
          startX = e.pageX;
          startW = th.offsetWidth;
          resizer.classList.add('active');
          function onMove(ev) {
            th.style.width = (startW + ev.pageX - startX) + 'px';
            th.style.minWidth = th.style.width;
          }
          function onUp() {
            resizer.classList.remove('active');
            document.removeEventListener('mousemove', onMove);
            document.removeEventListener('mouseup', onUp);
          }
          document.addEventListener('mousemove', onMove);
          document.addEventListener('mouseup', onUp);
          e.preventDefault();
        });
      });
    }

    // 초기 실행
    function init() {
      populateDropdowns();
      renderTable(rawData);
      initColumnResize();
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  </script>
