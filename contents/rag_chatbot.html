<!DOCTYPE html>
<html lang="ko">
<head>

  <style>
    :root{--sidebar:min(19vw,280px);--nav:#0f172a;--stage:#07111f;--green:#22c55e;--muted:rgba(255,255,255,.68)}
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{width:100%;height:100%;height:100dvh;overflow:hidden;background:var(--stage);font-family:Poppins,"Noto Sans KR","Malgun Gothic",sans-serif}
    body{display:flex;color:#f8fafc}
    aside{width:var(--sidebar);max-width:20vw;min-width:210px;flex:0 0 var(--sidebar);display:flex;flex-direction:column;overflow:hidden;background:var(--nav);box-shadow:8px 0 30px rgb(2 6 23/.2);z-index:5}
    .brand{padding:18px clamp(15px,1.5vw,22px) 15px;border-bottom:1px solid rgba(255,255,255,.11)}
    .kicker{display:flex;align-items:center;gap:7px;margin-bottom:7px;color:#86efac;font-size:11px;font-weight:800;letter-spacing:.09em}
    .kicker:before{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px rgb(34 197 94/.13);content:""}
    .brand h1{font-size:clamp(15px,1.25vw,20px);line-height:1.4;letter-spacing:-.045em}
    .progress{padding:12px clamp(15px,1.5vw,22px) 10px}
    .progress-row{display:flex;justify-content:space-between;margin-bottom:7px;color:var(--muted);font-size:11.5px;font-variant-numeric:tabular-nums}
    .track{height:5px;overflow:hidden;border-radius:99px;background:rgba(255,255,255,.13)}
    .bar{height:100%;background:linear-gradient(90deg,var(--green),#bbf7d0);transition:width .18s}
    .agenda{padding:6px clamp(15px,1.5vw,22px) 4px;color:rgba(255,255,255,.43);font-size:10px;font-weight:800;letter-spacing:.12em}
    nav{flex:1;min-height:0;overflow-y:auto;padding:2px 10px 12px;scrollbar-width:thin}
    nav button{display:grid;grid-template-columns:25px minmax(0,1fr);gap:6px;width:100%;margin:2px 0;padding:7px 8px;border:1px solid transparent;border-radius:8px;background:transparent;color:var(--muted);font:inherit;font-size:clamp(11px,.83vw,13px);line-height:1.34;text-align:left;cursor:pointer;overflow-wrap:break-word;word-break:keep-all;line-break:strict}
    nav button:hover{color:#fff;background:rgba(255,255,255,.07)}
    nav button:focus-visible{outline:2px solid #86efac;outline-offset:-2px}
    nav button.active{color:#fff;border-color:rgba(255,255,255,.11);background:linear-gradient(90deg,#173f9f,#1657be)}
    .toc-no{padding-top:1px;color:#86efac;font-size:10px;font-weight:800}
    .home{margin:0 15px 15px;padding-top:11px;border-top:1px solid rgba(255,255,255,.1);color:rgba(255,255,255,.79);font-size:12px;text-decoration:none}
    main{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;padding:clamp(10px,1.6vw,24px);background:radial-gradient(circle at 90% 5%,rgb(34 197 94/.09),transparent 25rem),var(--stage)}
    .stage{position:relative;width:min(100%,calc((100dvh - 48px)*1.77778));aspect-ratio:16/9;overflow:hidden;border:1px solid rgba(255,255,255,.09);border-radius:12px;background:#fff;box-shadow:0 26px 70px rgb(0 0 0/.35);cursor:pointer}
    .stage:focus-visible{outline:3px solid #86efac;outline-offset:4px}
    .viewport{position:absolute;inset:0;overflow:hidden}
    .canvas{position:absolute;left:50%;top:50%;width:1600px;height:900px;transform-origin:center center;background:#fff;overflow:hidden;color:#0c1a3a}
    .canvas:before{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 5% 85%,rgb(34 197 94/.055),transparent 240px),radial-gradient(circle at 92% 7%,rgb(20 40 160/.055),transparent 250px);content:""}
    .ppt-el{position:absolute}
    .ppt-shape{display:flex;overflow:hidden}
    .ppt-shape.roundRect{border-radius:12px}
    .ppt-shape.ellipse{border-radius:50%}
    .ppt-text{width:100%;display:flex;flex-direction:column;min-height:0}
    .ppt-text.anchor-ctr{justify-content:center}
    .ppt-text.anchor-b{justify-content:flex-end}
    .ppt-text p{
      margin:0;
      white-space:pre-line;
      overflow-wrap:break-word;
      word-break:keep-all;
      line-break:strict;
      line-height:1.3;
    }
    .ppt-image{display:block;object-fit:fill}
    .ppt-table{border-collapse:collapse;table-layout:fixed;background:#fff}
    .ppt-table td{border:1px solid #cbd5e1;vertical-align:middle;overflow:hidden}
    .ppt-line{height:0;transform-origin:left center}
    .code-block{position:absolute;z-index:2;padding:18px 24px;border-radius:9px;background:#0b1d46;color:#e2e8f0;font:15px/1.45 Consolas,"Cascadia Code",monospace;white-space:pre-wrap;overflow:hidden;box-shadow:inset 0 0 0 1px rgb(23 63 159/.55)}
    .slide-dark:before{background:radial-gradient(circle at 10% 90%,rgb(34 197 94/.13),transparent 270px),linear-gradient(135deg,#10205d,#173498)!important}
    .stage-last{cursor:default}
    @media(max-width:900px){
      body{flex-direction:column}
      aside{width:100%;max-width:none;min-width:0;max-height:36dvh;flex:0 0 auto}
      .brand{padding:11px 16px 8px}.kicker{margin-bottom:2px}.brand h1{font-size:15px}
      .progress{padding:7px 16px 5px}.agenda{display:none}
      nav{display:flex;gap:5px;flex:0 0 auto;overflow-x:auto;overflow-y:hidden;padding:2px 12px 8px}
      nav button{display:block;width:auto;min-width:58px;max-width:180px;margin:0;padding:7px 9px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
      .toc-no{margin-right:5px}.home{display:none}main{min-height:0;padding:8px}.stage{width:100%;border-radius:8px}
    }
    @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
  </style>
</head>

y":123.75,"w":1472.5,"h":2.5,"geom":"rect","fill":"#E2E8F0","text":{"margins":{"l":12,"r":12,"t":6,"b":6},"anchor":"ctr","paragraphs":[{"align":"center","level":0,"runs":[]}]}}],"code":[[64,203,1472,515,"from docling.document_converter import DocumentConverter\nfrom langchain_text_splitters import RecursiveCharacterTextSplitter\n\n# 1. Docling 변환기 초기화\nconverter = DocumentConverter()\n\n# 2. 20% Overlap 청크 생성 (1000자 기준 200자 중복)\ntext_splitter = RecursiveCharacterTextSplitter(\n    chunk_size=1000,\n    chunk_overlap=200  # Exact 20% Overlap\n)\n\n# 3. PDF/문서 파싱 후 마크다운 추출\nresult = converter.convert(\"data/sample.pdf\")\nmarkdown_text = result.document.export_to_markdown()\n\n# 4. 청크 생성 및 source 메타데이터 부여\nchunks = text_splitter.create_documents(\n    texts=[markdown_text],\n    metadatas=[{\"source\": \"sample.pdf\"}]\n)"]]},{"title":"Step 4. 파일별 중복 데이터 삭제 로직","background":"#ffffff","elements":[{"type":"image","z":1,"x":63.75,"y":66.875,"w":25.293,"h":32.5,"src":"image66.png"},{"type":"shape","z":2,"x":63.75,"y":151.25,"w":1472.5,"h":30,"geom":"rect","text":{"margins":{"l":0,"r":0,"t":0,"b":0},"anchor":"t","paragraphs":[{"align":"left","level":0,"runs":[{"text":"새 데이터 등록 시 DB 전체를 지우지 않고, metadata->>source에 기재된 ","size":20,"color":"#334155","font":"Noto Sans KR"},{"text":"동일 파일명의 기존 데이터만 선별 삭제","size":20,"bold":true,"color":"#16A34A","font":"Noto Sans KR"},{"text":" 후 저장합니다.","size":20,"color":"#334155","font":"Noto Sans KR"}]}]}},{"type":"shape","z":3,"x":104.043,"y":57.5,"w":1495.957,"h":53.75,"geom":"rect","text":{"margins":{"l":0,"r":0,"t":0,"b":0},"anchor":"ctr","paragraphs":[{"align":"left","level":0,"runs":[{"text":"Step 4. 파일별 중복 데이터 삭제 로직 (방법 2)","size":42,"bold":true,"color":"#1428A0","font":"Poppins"}]}]}},{"type":"shape","z":4,"x":63.75,"y":123.75,"w":1472.5,"h":2.5,"geom":"rect","fill":"#E2E8F0","text":{"margins":{"l":12,"r":12,"t":6,"b":6},"anchor":"ctr","paragraphs":[{"align":"center","level":0,"runs":[]}]}}],"code":[[64,203,1472,515,"import os\nfrom supabase import create_client, Client\n\nsupabase_client: Client = create_client(SUPABASE_URL, SUPABASE_SERVICE_KEY)\nall_docs = []\n\nif os.path.exists(\"data\"):\n    for file_name in os.listdir(\"data\"):\n        if file_name.endswith((\".pdf\", \".docx\", \".txt\")):\n            file_path = os.path.join(\"data\", file_name)\n\n            # [방법 2 핵심] DB에서 현재 파일명과 일치하는 레코드만 선택 삭제\n            supabase_client.table(\"documents\")\\\n                .delete()\\\n                .eq(\"metadata->>source\", file_name)\\\n                .execute()\n\n            # Docling 변환 & 청킹 후 목록 추가\n            res = converter.convert(file_path)\n            chunks = text_splitter.create_documents(\n                texts=[res.document.export_to_markdown()],\n                metadatas=[{\"source\": file_name}]\n            )\n            all_docs.extend(chunks)"]]},{"title":"Step 5. Gemini Embeddings & Supabase RAG Chain","background":"#ffffff","elements":[{"type":"image","z":1,"x":63.75,"y":62.5,"w":25.293,"h":32.5,"src":"image68.png"},{"type":"shape","z":2,"x":63.75,"y":142.5,"w":1472.5,"h":30,"geom":"rect","text":{"margins":{"l":0,"r":0,"t":0,"b":0},"anchor":"t","paragraphs":[{"align":"left","level":0,"runs":[{"text":"Google text-embedding-004와 Supabase Vector Store를 연동하고 대화 히스토리를 기억하는 RAG 체인을 구축합니다.","size":20,"color":"#334155","font":"Noto Sans KR"}]}]}},{"type":"shape","z":3,"x":104.043,"y":57.5,"w":1495.957,"h":45,"geom":"rect","text":{"margins":{"l":0,"r":0,"t":0,"b":0},"anchor":"ctr","paragraphs":[{"align":"left","level":0,"runs":[{"text":"Step 5. Gemini Embeddings & Supabase RAG Chain","size":42,"bold":true,"color":"#1428A0","font":"Poppins"}]}]}},{"type":"shape","z":4,"x":63.75,"y":115,"w":1472.5,"h":2.5,"geom":"rect","fill":"#E2E8F0","text":{"margins":{"l":12,"r":12,"t":6,"b":6},"anchor":"ctr","paragraphs":[{"align":"center","level":0,"runs":[]}]}}],"code":[[64,203,1472,515,"from langchain_google_genai import GoogleGenerativeAIEmbeddings, ChatGoogleGenerativeAI\nfrom langchain_community.vectorstores import SupabaseVectorStore\nfrom langchain.chains import create_history_aware_retriever, create_retrieval_chain\nfrom langchain.chains.combine_documents import create_stuff_documents_chain\n\n# 1. Gemini 임베딩 & Vector Store 연동\nembeddings = GoogleGenerativeAIEmbeddings(model=\"models/text-embedding-004\")\nvectorstore = SupabaseVectorStore.from_documents(\n    documents=all_docs, embedding=embeddings, client=supabase_client,\n    table_name=\"documents\", query_name=\"match_documents\"\n)\nretriever = vectorstore.as_retriever(search_kwargs={\"k\": 3})\n\n# 2. Gemini 1.5 Flash LLM 및 RAG 체인 결합\nllm = ChatGoogleGenerativeAI(model=\"gemini-1.5-flash\", temperature=0)\nhistory_aware_retriever = create_history_aware_retriever(llm, retriever, contextualize_q_prompt)\nquestion_answer_chain = create_stuff_documents_chain(llm, qa_prompt)\nrag_chain = create_retrieval_chain(history_aware_retriever, question_answer_chain)"]]},{"title":"Step 6. Cursor AI 에이전트 활용 프롬프트","background":"#ffffff","elements":[{"type":"image","z":1,"x":63.75,"y":151.25,"w":1472.5,"h":137.5,"src":"image70.png"},{"type":"image","z":2,"x":63.75,"y":66.875,"w":25.293,"h":32.5,"src":"image71.png"},{"type":"shape","z":3,"x":123.769,"y":177.5,"w":1455.542,"h":30,"geom":"rect","text":{"margins":{"l":0,"r":0,"t":0,"b":0},"anchor":"ctr","paragraphs":[{"align":"left","level":0,"runs":[{"text":"Cursor Composer (Cmd + I / Ctrl + I) 실행","size":24,"bold":true,"color":"#1428A0","font":"Poppins"}]}]}},{"type":"shape","z":4,"x":93.75,"y":220,"w":1416.25,"h":30,"geom":"rect","text":{"margins":{"l":0,"r":0,"t":0,"b":0},"anchor":"t","paragraphs":[{"align":"left","level":0,"runs":[{"text":"직접 코딩할 필요 없이 아래 프롬프트를 복사하여 Cursor Composer에 전달하면 app.py 전체 코드를 자동으로 완성해 줍니다.","size":20,"color":"#334155","font":"Noto Sans KR"}]}]}},{"type":"image","z":5,"x":93.75,"y":181.25,"w":17.519,"h":22.5,"src":"image72.png"},{"type":"shape","z":6,"x":104.043,"y":57.5,"w":1495.957,"h":53.75,"geom":"rect","text":{"ma 14.png"},{"type":"shape","z":2,"x":63.75,"y":151.25,"w":1472.5,"h":30,"geom":"rect","text":{"margins":{"l":0,"r":0,"t":0,"b":0},"anchor":"t","paragraphs":[{"align":"left","level":0,"runs":[{"text":"Docling으로 파싱된 20% Overlap 마크다운 청크를 로컬 `chroma_db` 디렉터리에 자동으로 영구 저장하고 조회가 가능하게 하는 코드입니다.","size":20,"color":"#334155","font":"Noto Sans KR"}]}]}},{"type":"shape","z":3,"x":104.043,"y":57.5,"w":1495.957,"h":53.75,"geom":"rect","text":{"margins":{"l":0,"r":0,"t":0,"b":0},"anchor":"ctr","paragraphs":[{"align":"left","level":0,"runs":[{"text":"[Session 2 - 3] ChromaDB + Gemini 파이프라인 연동","size":42,"bold":true,"color":"#1428A0","font":"Poppins"}]}]}},{"type":"shape","z":4,"x":63.75,"y":123.75,"w":1472.5,"h":2.5,"geom":"rect","fill":"#E2E8F0","text":{"margins":{"l":12,"r":12,"t":6,"b":6},"anchor":"ctr","paragraphs":[{"align":"center","level":0,"runs":[]}]}}],"code":[[64,203,1472,558,"import os\nfrom langchain_chroma import Chroma\nfrom langchain_google_genai import GoogleGenerativeAIEmbeddings\nfrom docling.document_converter import DocumentConverter\nfrom langchain_text_splitters import RecursiveCharacterTextSplitter\n\n# 1. Docling 변환 & 20% Overlap 청킹\nconverter = DocumentConverter()\ntext_splitter = RecursiveCharacterTextSplitter(chunk_size=1000, chunk_overlap=200)\n\n# 2. Gemini 768차원 임베딩 정의\nembeddings = GoogleGenerativeAIEmbeddings(model=\"models/text-embedding-004\")\n\n# 3. 로컬 ChromaDB 영구 저장 디렉터리 경로 지정\nDB_DIR = \"./chroma_db\"\n\n# 4. Chroma Vector Store 연동 (디렉터리가 없으면 자동 생성됨)\nvectorstore = Chroma(\n    collection_name=\"company_docs\",\n    embedding_function=embeddings,\n    persist_directory=DB_DIR\n)\nretriever = vectorstore.as_retriever(search_kwargs={\"k\": 3})"]]},{"title":"로컬 DB 파일별 선택 삭제","background":"#ffffff","elements":[{"type":"image","z":1,"x":63.75,"y":66.875,"w":25.293,"h":32.5,"src":"image116.png"},{"type":"shape","z":2,"x":63.75,"y":151.25,"w":1472.5,"h":30,"geom":"rect","text":{"margins":{"l":0,"r":0,"t":0,"b":0},"anchor":"t","paragraphs":[{"align":"left","level":0,"runs":[{"text":"ChromaDB 환경에서도 새 문서 등록 시 기존 동명 파일의 벡터 조각만 선택 삭제하여 DB 중복 축적을 완벽 차단합니다.","size":20,"color":"#334155","font":"Noto Sans KR"}]}]}},{"type":"shape","z":3,"x":104.043,"y":57.5,"w":1495.957,"h":53.75,"geom":"rect","text":{"margins":{"l":0,"r":0,"t":0,"b":0},"anchor":"ctr","paragraphs":[{"align":"left","level":0,"runs":[{"text":"[Session 2 - 4] 로컬 DB 파일별 선택 삭제 (방법 2)","size":42,"bold":true,"color":"#1428A0","font":"Poppins"}]}]}},{"type":"shape","z":4,"x":63.75,"y":123.75,"w":1472.5,"h":2.5,"geom":"rect","fill":"#E2E8F0","text":{"margins":{"l":12,"r":12,"t":6,"b":6},"anchor":"ctr","paragraphs":[{"align":"center","level":0,"runs":[]}]}}],"code":[[64,203,1472,515,"# 로컬 ChromaDB에서 메타데이터(source) 기반 기존 청크 선별 삭제 로직\nif os.path.exists(\"data\"):\n    for file_name in os.listdir(\"data\"):\n        if file_name.endswith((\".pdf\", \".docx\", \".txt\")):\n            file_path = os.path.join(\"data\", file_name)\n\n            # [방법 2 핵심] 로컬 ChromaDB에서 현재 파일명과 일치하는 기존 벡터만 선별 제거\n            try:\n                existing_ids = vectorstore.get(where={\"source\": file_name})[\"ids\"]\n                if existing_ids:\n                    vectorstore.delete(ids=existing_ids)\n                    print(f\"기존 {file_name} 데이터 {len(existing_ids)}개 삭제 완료\")\n            except Exception as e:\n                pass\n\n            # Docling 변환 & 20% Overlap 청킹 후 새로 추가\n            res = converter.convert(file_path)\n            chunks = text_splitter.create_documents(\n                texts=[res.document.export_to_markdown()],\n                metadatas=[{\"source\": file_name}]\n            )\n            vectorstore.add_documents(documents=chunks)"]]},{"title":"Cursor AI 에이전트 활용 프롬프트","background":"#ffffff","elements":[{"type":"image","z":1,"x":63.75,"y":151.25,"w":1472.5,"h":137.5,"src":"image70.png"},{"type":"image","z":2,"x":63.75,"y":66.875,"w":25.293,"h":32.5,"src":"image71.png"},{"type":"shape","z":3,"x":123.769,"y":177.5,"w":1455.542,"h":30,"geom":"rect","text":{"margins":{"l":0,"r":0,"t":0,"b":0},"anchor":"ctr","paragraphs":[{"align":"left","level":0,"runs":[{"text":"Cursor Composer (Cmd + I / Ctrl + I) 로컬 버전 프롬프트","size":24,"bold":true,"color":"#1428A0","font":"Poppins"}]}]}},{"type":"shape","z":4,"x":93.75,"y":220,"w":1416.25,"h":30,"geom":"rect","text":{"margins":{"l":0,"r":0,"t":0,"b":0},"anchor":"t","paragraphs":[{"align":"left","level":0,"runs":[{"text":"외부 클라우드 DB 없이 로컬 ChromaDB 및 사내망 배포용 app_local.py 전체 코드를 자동 생성하는 프롬프트입니다.","size":20,"color":"#334155","font":"Noto Sans KR"}]}]}},{"type":"image","z":5,"x":93.75,"y":181.25,"w":17.519,"h":22.5,"src":"image72.png"},{"type":"shape","z":6,"x":104.043,"y":57.5,"w":1495.957,"h":53.75,"geom":"rect","text":{"margins":{"l":0,"r":0,"t":0,"b":0},"anchor":"ctr","paragraphs":[{"align":"left","level":0,"runs":[{"text":"[Session 2 - 5] Cursor AI 에이전트 활용 프롬프트","size":42,"bold":true,"color":"#1428A0","font":"Poppins"}]}]}},{"type":"shape","z":7,"x":63.75,"y":123.75,"w":1472.5,"h":2.5,"geom":"rect","fill":"#E2E8F0","text":{"margins":{"l":12,"r":12,"t":6,"b":6},"anchor":"ctr","paragraphs":[{"align":"center","level":0,"runs":[]}]}}],"code":[[64,319,1472,309,"Docling, 로컬 ChromaDB, Gemini API 기반의 사내망 공유용 RAG 챗봇을 app_local.py에 작성해줘.\n\n[세부 구현 요구사항]\n1. .env에서 GEMINI_API_KEY를 load_dotenv()로 읽어올 것.\n2. data/ 폴더 안의 문서를 Docling(DocumentConverter)으로 마크다운 변환할 것.\n3. RecursiveCharacterTextSplitter 사용: chunk_size=1000, chunk_overlap=200 (20% 오버랩).\n4. GoogleGenerativeAIEmbeddings(models/text-embedding-004) 사용.\n5. 로컬 Vector DB로 Chroma(langchain_chroma) 사용 (persist_directory=\"./chroma_db\", collection_name=\"company_docs\").\n6. [중복 방지 - 방법 2]: 새 문서 추가 전 vectorstore.get(where={\"source\": file_name})[\"ids\"]를 조회하여\n   현재 파싱할 파일명의 기존 벡터 ID들을 vectorstore.delete(ids=...)로 선별 제거할 것.\n7. ChatGoogleGenerativeAI(gemini-1.5-flash) 및 Streamlit st.chat_message UI, 대화 메모리(chat_history) 연동.\n8. 코드가 완성되면 터미널에서 `streamlit run app_local.py --server.address 0.0.0.0 --server.port 8501`로 실행하는 안내 출력."]]}         style(node, {
          left: item.x + "px", top: item.y + "px", width: item.w + "px", height: item.h + "px", zIndex: item.z
        });
        var colgroup = el("colgroup");
        var total = (item.cols || []).reduce(function (a, b) { return a + b; }, 0) || 1;
        (item.cols || []).forEach(function (w) {
          var col = el("col");
          col.style.width = (w / total * 100) + "%";
          colgroup.appendChild(col);
        });
        node.appendChild(colgroup);
        (item.rows || []).forEach(function (row) {
          var tr = el("tr");
          tr.style.height = row.h + "px";
          (row.cells || []).forEach(function (cell) {
            var td = el("td");
            td.style.background = cell.fill || "#fff";
            renderText(cell.text, td);
            tr.appendChild(td);
          });
          node.appendChild(tr);
        });
      }
      if (node) canvas.appendChild(node);
    }
    function renderSlide(i) {
      var slide = slides[i];
      canvas.replaceChildren();
      canvas.style.background = slide.background || "#fff";
      canvas.classList.toggle("slide-dark", i === 14);
      (slide.code || []).forEach(function (block) {
        var pre = el("pre", "code-block");
        pre.textContent = block[4];
        style(pre, { left: block[0] + "px", top: block[1] + "px", width: block[2] + "px", height: block[3] + "px" });
        canvas.appendChild(pre);
      });
      (slide.elements || []).forEach(renderElement);
    }
    function preload(i) {
      if (i < 0 || i >= slides.length) return;
      (slides[i].elements || []).forEach(function (item) {
        if (item.type !== "image" || !item.src) return;
        var img = new Image();
        img.src = IMAGE_DIR + item.src;
      });
    }

    // ---- Common frame controller (shared by every page) ----
    slides.forEach(function (slide, i) {
      var btn = el("button");
      btn.type = "button";
      btn.tabIndex = i ? -1 : 0;
      var no = el("span", "toc-no");
      no.textContent = String(i + 1).padStart(2, "0");
      var label = el("span");
      label.textContent = slide.title || ("페이지 " + (i + 1));
      btn.appendChild(no);
      btn.appendChild(label);
      btn.addEventListener("click", function () { show(i, false); });
      toc.appendChild(btn);
    });
    var buttons = Array.prototype.slice.call(toc.querySelectorAll("button"));

    function fit() {
      var rect = stage.getBoundingClientRect();
      var scale = Math.min(rect.width / 1600, rect.height / 900);
      canvas.style.transform = "translate(-50%, -50%) scale(" + scale + ")";
    }
    function show(i, focusToc) {
      index = Math.max(0, Math.min(slides.length - 1, i));
      renderSlide(index);
      buttons.forEach(function (btn, n) {
        var active = n === index;
        btn.classList.toggle("active", active);
        btn.tabIndex = active ? 0 : -1;
        btn.setAttribute("aria-current", active ? "page" : "false");
      });
      buttons[index].scrollIntoView({ block: "nearest", inline: "nearest" });
      progressText.textContent = String(index + 1).padStart(2, "0") + " / " + slides.length;
      progressBar.style.width = ((index + 1) / slides.length * 100) + "%";
      progressTrack.setAttribute("aria-valuenow", String(index + 1));
      stage.classList.toggle("stage-last", index === slides.length - 1);
      stage.setAttribute("aria-label", index === slides.length - 1 ? "마지막 페이지" : "현재 페이지. 클릭하면 다음 페이지로 이동합니다");
      document.title = (slides[index].title || "RAG") + " | RAG 챗봇 구축 가이드";
      if (focusToc) buttons[index].focus({ preventScroll: true });
      fit();
      preload(index + 1);
    }
    function move(delta, focusToc) {
      var next = Math.max(0, Math.min(slides.length - 1, index + delta));
      if (next !== index) show(next, focusToc);
    }

    stage.addEventListener("click", function () { if (index < slides.length - 1) show(index + 1, false); });
    stage.addEventListener("keydown", function (e) {
      if ((e.key === "Enter" || e.key === " ") && index < slides.length - 1) {
        e.preventDefault();
        show(index + 1, false);
      }
    });
    toc.addEventListener("keydown", function (e) {
      if (!["ArrowDown","ArrowUp","ArrowRight","ArrowLeft","PageDown","PageUp","Home","End"].includes(e.key)) return;
      e.preventDefault();
      e.stopPropagation();
      if (e.key === "Home") return show(0, true);
      if (e.key === "End") return show(slides.length - 1, true);
      move(["ArrowDown","ArrowRight","PageDown"].includes(e.key) ? 1 : -1, true);
    });
    document.addEventListener("keydown", function (e) {
      if (e.defaultPrevented || e.target.closest("a,button,input,textarea,select")) return;
      if (["ArrowDown","ArrowRight","PageDown"].includes(e.key)) { e.preventDefault(); move(1, false); }
      if (["ArrowUp","ArrowLeft","PageUp"].includes(e.key)) { e.preventDefault(); move(-1, false); }
      if (e.key === "Home") { e.preventDefault(); show(0, false); }
      if (e.key === "End") { e.preventDefault(); show(slides.length - 1, false); }
    });
    new ResizeObserver(fit).observe(stage);
    show(0, false);
  </script>
</body>
</html>
