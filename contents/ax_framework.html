<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1428a0">
  <title>AX Framework</title>
  <style>
    :root{--blue:#1428a0;--blue2:#0064d2;--sky:#00a9e0;--navy:#071a52;--ink:#17233e;--muted:#63718b;--line:#dbe6f4;--pale:#f6f9ff;--side:300px;--card-max:1280px;--content-gap:20px;--font-title:clamp(27px,1.85vw,32px);--font-subtitle:clamp(17px,1.15vw,20px);--font-body:clamp(14px,.96vw,15px);--font-sub:clamp(13px,.88vw,14px);--font-caption:12px}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;color:var(--ink);background:radial-gradient(circle at 92% 8%,rgb(0 169 224/.12),transparent 26rem),linear-gradient(135deg,#edf4fc,#f8fbff 52%,#edf5ff);font-family:Pretendard,"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;letter-spacing:-.015em;line-height:1.2}
    aside{position:fixed;inset:0 auto 0 0;z-index:20;width:var(--side);display:flex;flex-direction:column;color:#fff;background:#0f172a;box-shadow:14px 0 38px rgb(6 23 64/.15)}
    .brand{padding:22px 22px 17px;border-bottom:1px solid rgb(255 255 255/.12)}.brand h1{margin:0;font-size:26px;line-height:1.25;letter-spacing:-.045em}
    .progress{padding:10px 22px 9px}.progress-row{display:flex;justify-content:space-between;margin-bottom:6px;color:rgb(255 255 255/.72);font-size:12px}.track{height:5px;overflow:hidden;border-radius:9px;background:rgb(255 255 255/.13)}.bar{width:5%;height:100%;border-radius:inherit;background:linear-gradient(90deg,#43c9ff,#fff);transition:width .25s ease}
    nav{flex:1;overflow-y:auto;padding:3px 13px 14px;scrollbar-width:thin}nav a{display:grid;grid-template-columns:31px minmax(0,1fr);gap:8px;align-items:start;margin:2px 0;padding:8px 10px;border:1px solid transparent;border-radius:9px;color:rgb(255 255 255/.72);font-size:14px;line-height:1.32;text-align:left;text-decoration:none;word-break:keep-all;overflow-wrap:break-word;transition:.18s}nav a span:last-child{min-width:0;text-wrap:pretty}nav a:hover{color:#fff;background:rgb(255 255 255/.07)}nav a.active{color:#fff;border-color:rgb(255 255 255/.1);background:linear-gradient(90deg,#0064d2,#0879dc);box-shadow:0 8px 20px rgb(0 0 0/.17)}.toc-no{padding-top:1px;font-size:11.5px;font-weight:850;letter-spacing:.08em;opacity:.78}
    main{margin-left:var(--side)}.page{height:100vh;height:100dvh;min-height:570px;padding:clamp(14px,2vh,20px) var(--content-gap);display:flex;align-items:center;overflow:hidden}.card{position:relative;width:min(calc(100vw - var(--side) - var(--content-gap) - var(--content-gap)),var(--card-max));height:100%;max-height:900px;min-height:0;margin:auto;display:flex;flex-direction:column;overflow:hidden;border:1px solid rgb(20 40 160/.1);border-radius:19px;background:rgb(255 255 255/.97);box-shadow:0 20px 58px rgb(18 44 89/.11);cursor:pointer;outline:none;transition:.2s}.card:hover{transform:translateY(-2px);box-shadow:0 25px 66px rgb(18 44 89/.15)}.card:focus-visible{box-shadow:0 0 0 4px rgb(0 100 210/.2),0 20px 58px rgb(18 44 89/.13)}.card:before{content:"";position:absolute;inset:0 0 auto;height:4px;background:linear-gradient(90deg,var(--blue),var(--blue2),var(--sky))}
    .head{min-height:74px;padding:12px 21px 10px;display:flex;align-items:center;gap:13px;border-bottom:1px solid var(--line);background:linear-gradient(90deg,#fff,#f8fbff)}.head>div:nth-child(2){min-width:0}.num{flex:0 0 auto;display:grid;place-items:center;min-width:48px;height:43px;padding:0 9px;border-radius:12px;color:#fff;background:linear-gradient(145deg,var(--blue),var(--blue2));font-size:var(--font-caption);font-weight:850;box-shadow:0 7px 16px rgb(20 40 160/.2)}.kicker{margin-bottom:3px;color:var(--blue2);font-size:var(--font-caption);font-weight:850;letter-spacing:.1em}.head h2{margin:0;color:var(--navy);font-size:var(--font-title);line-height:1.25;letter-spacing:-.045em;text-align:left;text-wrap:balance;word-break:keep-all;overflow-wrap:break-word}.count{margin-left:auto;color:var(--muted);font-size:var(--font-caption);white-space:nowrap}
    .body{flex:1;min-height:0;overflow:auto;padding:clamp(16px,2vh,22px) clamp(19px,2.2vw,30px);scrollbar-width:thin;scrollbar-color:#b8cae6 transparent;text-align:left;word-break:keep-all;overflow-wrap:break-word}.lead{max-width:96%;margin:0 0 13px;color:#283655;font-size:clamp(16px,1.12vw,18px);font-weight:650;line-height:1.55;text-align:left;text-wrap:pretty}.key-message{max-width:100%;padding:13px 16px;border-left:5px solid #65a30d;border-radius:0 12px 12px 0;color:#1a2e05;background:#f7fee7;font-size:clamp(20px,1.5vw,24px);font-weight:800;line-height:1.4;text-align:left;text-wrap:balance}.body h3{margin:0 0 8px;color:var(--blue);font-size:var(--font-subtitle);line-height:1.35;text-align:left;text-wrap:balance;word-break:keep-all}.body h4{margin:11px 0 6px;color:var(--navy);font-size:var(--font-sub);line-height:1.4;text-align:left}.body p{margin:5px 0;font-size:var(--font-body);line-height:1.55;text-align:left;text-wrap:pretty}.body ul,.body ol{margin:6px 0;padding-left:1.45em;list-style-position:outside}.body li{margin:4px 0;padding-left:.12em;font-size:var(--font-body);line-height:1.52;text-align:left;text-wrap:pretty}.body li::marker{font-size:.88em}.body li ul{margin:3px 0}.grid2,.grid3,.grid4,.grid5{display:grid;gap:12px;align-items:stretch}.grid2{grid-template-columns:repeat(2,minmax(0,1fr))}.grid3{grid-template-columns:repeat(3,minmax(0,1fr))}.grid4{grid-template-columns:repeat(4,minmax(0,1fr))}.grid5{grid-template-columns:repeat(5,minmax(0,1fr))}.grid2>.panel,.grid3>.panel,.grid4>.panel,.grid5>.panel{height:100%}.panel{min-width:0;padding:12px 14px;border:1px solid var(--line);border-radius:13px;background:var(--pale);text-align:left}.panel.white{background:#fff}.panel.sky{border-color:#cce9fa;background:linear-gradient(145deg,#eaf7ff,#f7fcff)}.panel.blue{color:#fff;border:0;background:linear-gradient(145deg,#1428a0,#0064d2)}.panel.blue h3,.panel.blue h4{color:#fff}.tag{display:inline-flex;margin-bottom:7px;padding:4px 8px;border-radius:99px;color:var(--blue);background:#e5edff;font-size:11px;font-weight:850;letter-spacing:.05em}.blue .tag{color:#fff;background:rgb(255 255 255/.16)}.content-section+ .content-section{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
    .flow{position:relative;margin:6px 0 12px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:9px}.flow:before{content:"";position:absolute;left:7%;right:7%;top:24px;height:4px;border-radius:9px;background:linear-gradient(90deg,var(--blue),var(--sky))}.step{position:relative;z-index:1;min-width:0;text-align:center}.dot{width:49px;height:49px;margin:0 auto 6px;display:grid;place-items:center;border:5px solid #dce8ff;border-radius:50%;color:#fff;background:var(--blue2);font-weight:850}.step b{display:block;color:var(--navy);font-size:15px;line-height:1.35;word-break:keep-all}.step span{display:block;margin-top:3px;color:var(--muted);font-size:12.5px;line-height:1.4;word-break:keep-all;text-wrap:pretty}
    .table{overflow-x:auto}table{width:100%;border-collapse:separate;border-spacing:0;overflow:hidden;border:1px solid var(--line);border-radius:11px;font-size:13.5px;text-align:left}th{padding:8px 9px;color:#fff;background:var(--blue);text-align:left;line-height:1.4}td{padding:7px 9px;border-top:1px solid var(--line);background:#fff;vertical-align:top;line-height:1.5;text-align:left;word-break:keep-all;overflow-wrap:break-word}tr:nth-child(even) td{background:#f7faff}.quote{margin:12px 0 0;padding:12px 15px;border-left:5px solid #65a30d;border-radius:0 11px 11px 0;color:#1a2e05;background:#f7fee7;font-size:16px;font-weight:700;line-height:1.55;text-align:left;text-wrap:pretty}.note{margin-top:8px;color:var(--muted)!important;font-size:12.5px!important}.bad{color:#d63754}.good{color:#067a64}.foot{min-height:42px;padding:0 20px;display:flex;align-items:center;justify-content:flex-end;gap:8px;color:var(--muted);border-top:1px solid #edf2f9;background:#fbfdff;font-size:12px;line-height:1.4}.down{color:var(--blue2);font-size:18px}.page:last-child .foot{visibility:hidden}
    @media(min-width:901px){#card-2 .body{overflow:hidden;padding:10px 30px 8px}#card-2 .content-section+ .content-section{margin-top:10px;padding-top:10px}#card-2 .lead{margin-bottom:7px;font-size:15px;line-height:1.35}#card-2 .grid3{gap:10px}#card-2 .panel{padding:9px 12px}#card-2 .tag{margin-bottom:4px;padding:3px 8px}#card-2 .body h3{margin-bottom:4px;font-size:17px;line-height:1.25}#card-2 .body p{margin:2px 0;font-size:14px;line-height:1.35}#card-2 th{padding:6px 9px;font-size:13px;line-height:1.3}#card-2 td{padding:5px 9px;font-size:13px;line-height:1.3}#card-2 .quote{margin-top:8px;padding:9px 13px;font-size:14.5px;line-height:1.35}}
    .top{position:fixed;right:23px;bottom:21px;z-index:30;width:43px;height:43px;display:grid;place-items:center;border:0;border-radius:50%;color:#fff;background:var(--blue);box-shadow:0 9px 24px rgb(20 40 160/.25);cursor:pointer;opacity:0;pointer-events:none;transform:translateY(8px);transition:.2s}.top.show{opacity:1;pointer-events:auto;transform:none}
    @media(max-width:1100px){:root{--content-gap:16px;--font-title:clamp(25px,2.5vw,29px);--font-body:14px}.grid5{grid-template-columns:repeat(3,minmax(0,1fr))}.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:900px){:root{--side:0px;--content-gap:10px;--font-title:clamp(22px,5.5vw,28px);--font-subtitle:17px;--font-body:14px}aside{position:sticky;top:0;width:100%;height:auto;display:block}.brand{padding:10px 15px 8px}.brand small,.brand p,.progress{display:none}.brand h1{font-size:20px}nav{display:flex;gap:5px;overflow-x:auto;padding:7px 10px 9px}nav a{flex:0 0 auto;display:block;margin:0;padding:8px 10px;font-size:14px}nav a span:last-child{display:none}main{margin:0}.page{height:calc(100vh - 73px);height:calc(100dvh - 73px);min-height:480px;padding:10px;scroll-margin-top:73px}.card{width:calc(100vw - 20px);height:100%;min-height:0;border-radius:13px}.head{min-height:64px;padding:9px 13px}.body{padding:13px}.grid2,.grid3,.grid4,.grid5{grid-template-columns:1fr}.flow{grid-template-columns:1fr}.flow:before{display:none}.step{display:grid;grid-template-columns:45px 1fr;text-align:left;align-items:center}.dot{width:40px;height:40px;margin:0;border-width:4px;grid-row:span 2}.step span{margin:0}.count{display:none}}@media(max-height:760px) and (min-width:901px){:root{--font-title:clamp(25px,1.7vw,29px);--font-subtitle:17px;--font-body:14px}.brand{padding-top:17px;padding-bottom:13px}.brand h1{font-size:24px}nav a{padding-top:6px;padding-bottom:6px;font-size:13px}.head{min-height:66px}.body{padding-top:14px;padding-bottom:14px}.panel{padding-top:10px;padding-bottom:10px}.foot{min-height:38px}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}@media print{aside,.top,.foot{display:none!important}main{margin:0}.page{height:auto;min-height:auto;padding:12mm;overflow:visible;break-after:page}.card{width:100%;height:auto;max-height:none;min-height:0;box-shadow:none}.body{overflow:visible}}
  </style>

<body>
  <aside><div class="brand"><h1>AX Framework</h1></div><div class="progress"><div class="progress-row"><span>진행률</span><span id="progressText">01 / 18</span></div><div class="track"><div class="bar" id="bar"></div></div></div><nav id="toc"></nav><a href="/" target="_top" style="margin:auto 16px 18px;color:rgba(255,255,255,.82);font-size:12.5px;line-height:1.4;text-decoration:none">목록으로</a></aside>
  <main id="main"></main>
  <button class="top" id="top" type="button" aria-label="첫 카드로 이동">↑</button>
  <script>
    const sectionTitles=["전체 프레임워크","업무 구조화 및 진단","관찰과 해석의 분리","STATIK 업무 분석","BDW 진단","AI FIT 평가","AI FIT 스코어 매트릭스","Quick Win 선정","AI-First 프로세스 설계","역할 재배치 사례","실행(Deliver)","내재화(Deepen)","Lessons Learned"];
    const cards=[
      {s:1,n:"1",k:"FRAMEWORK",t:"전체 프레임워크 · 5D 프레임워크",c:`
        <p class="lead">현장에서 AX를 수행할 때 필요한 5단계 실행 여정입니다.</p>
        <div class="flow"><div class="step"><div class="dot">1</div><b>탐색 Discover</b><span>무슨 일이 일어나고 있는가?</span></div><div class="step"><div class="dot">2</div><b>진단 Diagnose</b><span>왜 이런 현상이 발생하는가?</span></div><div class="step"><div class="dot">3</div><b>설계 Design</b><span>어떤 방향으로 해결할 것인가?</span></div><div class="step"><div class="dot">4</div><b>실행 Deliver</b><span>어떻게 실행하고 검증할 것인가?</span></div><div class="step"><div class="dot">5</div><b>내재화 Deepen</b><span>어떻게 지속할 것인가?</span></div></div>
        <div class="grid5"><div class="panel blue"><h3>1. 탐색</h3><ul><li><b>핵심 질문:</b> 무슨 일이 일어나고 있는가?</li><li>현황과 전체 업무 흐름 파악</li><li><b>활용 도구</b><ul><li>Landscape View: 전체 조망</li><li>Process Flow Map: 업무 흐름</li><li>Future Back: 미래 비전</li></ul></li></ul></div><div class="panel"><h3>2. 진단</h3><ul><li><b>핵심 질문:</b> 왜 이런 현상이 발생하는가?</li><li>업무를 세분화하고 병목·지연·낭비 요소 분석</li></ul></div><div class="panel sky"><h3>3. 설계</h3><ul><li><b>핵심 질문:</b> 어떤 방향으로 해결할 것인가?</li><li>AI 적용 가능성과 우선순위 평가</li><li>AI-First 방식으로 미래 프로세스 설계</li></ul></div><div class="panel"><h3>4. 실행</h3><ul><li><b>핵심 질문:</b> 어떻게 실행하고 검증할 것인가?</li><li>파일럿, 프로토타입, 스프린트로 빠르게 실행·검증</li></ul></div><div class="panel"><h3>5. 내재화</h3><ul><li><b>핵심 질문:</b> 어떻게 지속할 것인가?</li><li>경험에서 학습하고 조직의 지식과 변화 역량으로 축적</li></ul></div></div>`},

      {s:2,n:"2-1",k:"PROCESS FLOW MAP · WORK HIERARCHY",t:"업무 구조화 및 진단 · Process Flow Map과 업무 계층",c:`
        <div class="content-section"><h3>2.1 Process Flow Map</h3><p class="lead">도메인의 업무가 어떻게 흘러가는지 파악하는 업무 구조도입니다.</p>
        <div class="grid3"><div class="panel"><span class="tag">L1 도메인</span><h3>기업의 큰 업무 영역</h3><p><b>예:</b> 마케팅</p></div><div class="panel"><span class="tag">L2 기능</span><h3>도메인 안의 큰 업무 묶음 3~4개</h3><p><b>질문:</b> 이 도메인에서 수행하는 큰 업무는 무엇인가?</p><p><b>예:</b> 콘텐츠 관리, 프로모션 기획</p></div><div class="panel sky"><span class="tag">L3 프로세스</span><h3>기능을 구성하는 구체적인 업무 단위</h3><p><b>질문:</b> 이 기능에서 구체적으로 무엇을 하는가?</p><p><b>예:</b> 리뷰 답글 작성, SNS 콘텐츠 게시</p></div></div></div>
        <div class="content-section"><h3>2.2 업무 계층</h3><p class="lead">업무를 AI 적용 여부를 판단할 수 있는 최소 행동까지 분해합니다.</p>
        <div class="table"><table><thead><tr><th>레벨</th><th>명칭</th><th>정의 및 예시</th></tr></thead><tbody><tr><td>L1</td><td>조직 기능</td><td>기업의 밸류체인 영역: 연구개발, 제조, 영업·마케팅</td></tr><tr><td>L2</td><td>업무 도메인</td><td>도메인별 핵심 프로세스: SW 개발, 품질관리, 인사</td></tr><tr><td>L3</td><td>핵심 기능</td><td>목적별 세부 기능: 프런트엔드 개발, 콘텐츠 제작</td></tr><tr><td>L4</td><td>업무 모듈</td><td>연관 업무의 묶음: UI 구현, SNS 채널 관리</td></tr><tr><td>L5</td><td>단위 업무</td><td>독립된 결과물을 만드는 업무: 컴포넌트 개발, 불량 판별</td></tr><tr><td>L6</td><td>Action</td><td>더 나눌 수 없는 실제 행동: 초안 작성, 데이터 입력</td></tr></tbody></table></div>
        <div class="quote">분석의 핵심은 <b>L6 Action 수준까지 내려가는 것</b>입니다.</div></div>`},
      {s:2,n:"2-3",k:"L6 RULE",t:"업무 구조화 및 진단 · L6 작성 규칙",c:`
        <p class="lead key-message">L6는 반드시 <b>목적어 + 동사</b> 형태로 작성합니다.</p>
        <div class="grid2"><div class="panel blue"><h3>좋은 예</h3><ul><li>POS 화면을 터치한다.</li><li>재고 수량을 입력한다.</li><li>승인 버튼을 클릭한다.</li></ul></div><div class="panel"><h3>나쁜 예</h3><ul><li><b>확인:</b> 동작만 있고 대상이 없음</li><li><b>재고 관리:</b> 범위가 추상적임</li><li><b>처리:</b> 행동이 모호함</li></ul></div></div>
        <div class="quote"><b>최종 판단 질문:</b> “ChatGPT가 이 일을 대신할 수 있는가?”</div>`},

      {s:3,n:"3",k:"FACT BASED",t:"관찰과 해석의 분리",c:`
        <p class="lead"><b>관찰을 먼저 제시하고 해석은 별도로 구분</b>해야 합니다.</p>
        <div class="grid2"><div class="panel blue"><h3>관찰 Observation</h3><ul><li>측정하거나 확인할 수 있음</li><li>누가 보더라도 같은 결론에 도달</li><li>숫자·행동·사실 중심</li><li><b>예:</b> “회의가 2시간 동안 진행되었다.”</li></ul></div><div class="panel"><h3>해석 Interpretation</h3><ul><li>주관적 판단이 포함됨</li><li>사람마다 판단이 달라질 수 있음</li><li>감정·의견·추측 중심</li><li><b>예:</b> “회의가 너무 길었다.”</li></ul></div></div>
        <div class="panel sky" style="margin-top:12px"><h3>구분 방법</h3><ul><li>숫자와 구체적인 행동 → 관찰</li><li>“너무”, “적절하다”, “~처럼 보였다” → 해석</li></ul></div>`},

      {s:4,n:"4",k:"STATIK",t:"STATIK을 활용한 업무 분석",c:`
        <h3>4.1 STATIK 정의</h3><p class="lead"><b>System Thinking Approach To Introducing Kanban</b></p>
        <div class="grid3"><div class="panel blue"><p>팀 업무를 효율적으로 바꾸고 복잡한 문제를 해결하는 접근법</p></div><div class="panel"><p>원래는 칸반 도입을 위한 시스템 사고 방법론</p></div><div class="panel sky"><p>본 프레임워크에서는 업무를 세부적으로 분석하는 부분을 활용</p></div></div>
        <div class="grid2" style="margin-top:12px"><div class="panel"><h3>4.2 핵심 질문</h3><ul><li>우리 팀의 미션과 목적은 무엇인가?</li><li>고객과 이해관계자는 누구인가?</li><li>고객은 어떤 불편을 말하는가?</li><li>업무는 어떻게 흘러가는가?</li><li>업무가 잘 흐르는 지점과 막히는 지점은 어디인가?</li><li>어떤 지점을 어떻게 개선할 수 있는가?</li></ul></div><div class="panel sky"><h3>4.3 업무 분석 구조</h3><ul><li>L3 기능</li><li>L4 모듈</li><li>L5 단위 업무</li><li>L6 액션</li></ul><div class="quote">업무를 최소 행동까지 분해한 후 문제가 발생하는 위치를 찾습니다.</div></div></div>`},

      {s:5,n:"5",k:"BDW",t:"BDW 진단 · 병목·지연·비가치 활동",c:`
        <p class="lead">BDW는 현재 업무 시스템을 흐름 관점에서 진단하고 어디를 개선해야 효과가 큰지 찾는 방법입니다.</p>
        <div class="content-section"><div class="grid2"><div class="panel"><h3>5.1 Bottleneck: 병목</h3><p>시스템 전체의 처리 속도를 제한하는 지점입니다.</p><ul><li>처리량보다 유입량이 많음</li><li>일이 계속 쌓이는 지점</li><li>유난히 오래 걸리는 단계</li><li>항상 과부하가 발생하는 단계</li></ul><h4>예</h4><ul><li>그릴 2개로 동시에 조리할 수 있는 양이 8개로 제한</li><li>특정 단계가 느려 전체 프로세스가 함께 느려짐</li></ul></div><div class="panel"><h3>5.2 Delay: 지연</h3><p>기다림이나 대기로 인해 발생하는 시간 손실입니다.</p><ul><li>일을 하지 않는 시간이 가장 긴 지점</li><li>다음 단계로 넘어가기 전 대기시간</li><li>승인 대기</li><li>시스템 로딩</li><li>인수인계 대기</li></ul></div></div></div>
        <div class="content-section"><h3>5.3 Waste: 비가치 활동</h3><p class="lead">고객 가치에 기여하지 않는 활동입니다.</p>
        <div class="grid3"><div class="panel"><h3>고객 관점 질문</h3><ul><li>해당 활동이 없어도 고객이 불편하지 않은가?</li><li>결과물을 실제 고객이 사용하는가?</li></ul></div><div class="panel"><h3>대표 사례</h3><ul><li>중복 입력</li><li>불필요한 확인</li><li>사용되지 않는 보고서 작성</li></ul></div><div class="panel"><h3>표기 참고</h3><p>세 번째 항목은 이미지에서 Delay로 중복 표기되어 있지만, 설명상 BDW의 Waste에 해당합니다.</p></div></div></div>`},

      {s:6,n:"6-1",k:"AI FIT",t:"AI FIT 평가 · AI 적용 가능성",c:`
        <p class="lead">BDW로 식별한 업무를 대상으로 다음 두 가지를 평가합니다.</p><ul><li>AI 적용 가능성</li><li>현재 업무의 비효율성</li></ul>
        <h3>6.1 AI 적용 가능성</h3><div class="table"><table><thead><tr><th>점수</th><th>판단 기준</th><th>예시</th></tr></thead><tbody><tr><td>5점</td><td>명확한 규칙·반복·충분한 데이터, 판단 불필요</td><td>데이터 입력, 단순 분류, 알림 발송</td></tr><tr><td>4점</td><td>AI가 대부분 처리, 일부 예외 존재</td><td>리뷰 답글 초안, 발주량 추천</td></tr><tr><td>3점</td><td>AI가 보조하고 사람이 최종 판단</td><td>품질검수 1차 필터링, 이상 탐지</td></tr><tr><td>2점</td><td>창의성·감정 대응이 필요해 제한적 지원</td><td>컴플레인 대응, 메뉴 기획</td></tr><tr><td>1점</td><td>고도의 판단·감성·신체 활동 필요</td><td>AI 적용이 어려운 업무</td></tr></tbody></table></div>`},
      {s:6,n:"6-2",k:"AI FIT",t:"AI FIT 평가 · 비효율성과 평가 방법",c:`
        <div class="grid2"><div class="panel"><h3>6.2 비효율성</h3><h4>5점: 매우 비효율적</h4><ul><li>매일 발생</li><li>업무에 큰 지장</li><li>시간과 비용이 많이 소요</li><li>직원 불만이 높음</li></ul><h4>3점: 보통</h4><ul><li>가끔 발생</li><li>감내할 수 있음</li><li>개선하면 좋지만 긴급하지 않음</li></ul><h4>1점: 효율적</h4><ul><li>의미 있는 비효율이 없음</li></ul></div><div class="panel"><h3>6.3 평가 방법</h3><ul><li>각 팀원이 개별적으로 점수 부여</li><li>점수 평균 산출</li><li>팀원 간 점수 차이가 크면 근거를 토론</li><li><b>평가표 항목</b><ul><li>BDW 항목(L5/L6)</li><li>BDW 유형</li><li>AI 적용 가능성</li><li>비효율성</li></ul></li></ul></div></div>`},

      {s:7,n:"7",k:"SCORE MATRIX",t:"AI FIT 스코어 매트릭스",c:`
        <p class="lead">가로축은 <b>AI 적용 가능성</b>, 세로축은 <b>비효율성</b>입니다.</p>
        <div class="table"><table><thead><tr><th>영역</th><th>조건</th><th>대응 방향</th></tr></thead><tbody><tr><td><b>A</b></td><td>AI 가능성 높음·비효율성 높음</td><td>AI 적용 우선, 즉시 도입 검토</td></tr><tr><td><b>B</b></td><td>AI 가능성 낮음·비효율성 높음</td><td>수동 개선 우선, 프로세스·도구 개선</td></tr><tr><td><b>C</b></td><td>AI 가능성 높음·비효율성 낮음</td><td>장기 검토</td></tr><tr><td><b>D</b></td><td>AI 가능성 낮음·비효율성 낮음</td><td>현상 유지</td></tr></tbody></table></div>`},

      {s:8,n:"8-1",k:"QUICK WIN",t:"Quick Win 선정 · 정의",c:`
        <h3>8.1 Quick Win 정의</h3><p class="lead">짧은 시간 안에 가시적인 성과를 만들 수 있는 과제입니다.</p>
        <div class="grid2"><div class="panel blue"><h3>단순히 쉬운 과제가 아님</h3><p>다음 요소를 함께 고려합니다.</p><ul><li>전략적 비즈니스 임팩트</li><li>실행 가능성</li><li>학습 가치</li></ul></div><div class="panel sky"><h3>선정 기준</h3><p>현업 Pain Point를 기준으로 <b>3~12주 내 PoC 또는 Pilot 성과</b>를 낼 수 있는 과제</p></div></div>`},
      {s:8,n:"8-2",k:"QUICK WIN",t:"Quick Win 매트릭스와 평가 요소",c:`
        <h3>8.2 Quick Win 매트릭스</h3><p class="lead">가로축은 <b>난이도</b>, 세로축은 <b>비즈니스 임팩트</b>입니다.</p>
        <div class="table"><table><thead><tr><th>영역</th><th>조건</th><th>대응</th></tr></thead><tbody><tr><td>Quick Win</td><td>임팩트 높음·난이도 낮음</td><td>즉시 착수, 1~3개월 내 성과</td></tr><tr><td>Strategic</td><td>임팩트 높음·난이도 높음</td><td>중장기 로드맵 배치</td></tr><tr><td>Fill-in</td><td>임팩트 낮음·난이도 낮음</td><td>자원 여유 시 추진</td></tr><tr><td>Drop</td><td>임팩트 낮음·난이도 높음</td><td>보류 또는 제외</td></tr></tbody></table></div>
        <div class="grid2" style="margin-top:11px"><div class="panel"><h3>8.3 비즈니스 임팩트 평가 요소</h3><ul><li>비용 절감 규모</li><li>생산성 향상 정도</li><li>품질 개선 효과</li><li>전략적 중요도</li></ul></div><div class="panel sky"><h3>8.3 난이도 평가 요소</h3><ul><li>기술적 복잡성</li><li>데이터 준비 수준</li><li>조직 변화 범위</li><li>소요 시간</li><li>투자 규모</li></ul></div></div>`},

      {s:9,n:"9",k:"AI-FIRST",t:"AI-First 프로세스 설계",c:`
        <p class="lead">핵심 방향은 <b>“AI가 먼저 수행하고, 사람은 예외를 처리한다”</b>입니다.</p>
        <h3>9.1 설계 원칙</h3><div class="grid4"><div class="panel blue"><h3>원칙 1</h3><p>AI가 할 수 있는 일은 AI가 수행</p></div><div class="panel"><h3>원칙 2</h3><p>사람은 AI가 못하는 일에 집중</p></div><div class="panel sky"><h3>원칙 3</h3><p>불필요한 단계는 제거</p></div><div class="panel"><h3>원칙 4</h3><p>반복 작업은 자동화</p></div></div>
        <h3 style="margin-top:13px">9.2 Human-in-the-Loop 유형</h3><div class="grid4"><div class="panel"><h3>AI 초안 → 사람 확인</h3><ul><li>AI가 만들고 사람이 승인</li><li>예: 리뷰 답글, 보고서</li></ul></div><div class="panel"><h3>AI 추천 → 사람 선택</h3><ul><li>AI가 옵션을 제시하고 사람이 결정</li><li>예: 발주량 추천</li></ul></div><div class="panel"><h3>AI 실행 → 사람 모니터링</h3><ul><li>AI가 자동 실행하고 사람이 감시</li><li>예: 이상 탐지</li></ul></div><div class="panel"><h3>예외 발생 → 사람 개입</h3><ul><li>정상 업무는 AI, 예외만 사람이 처리</li><li>예: 부정 리뷰 검토</li></ul></div></div>`},

      {s:10,n:"10-1",k:"ROLE REDESIGN",t:"역할 재배치 사례 · AS-IS",c:`
        <h3>대상 프로세스</h3><p class="lead">경영관리 → 재무관리 → 실적보고 → 월간 매출 보고서 작성 → 데이터 취합</p>
        <h3>AS-IS</h3><div class="table"><table><thead><tr><th>L6 액션</th><th>사람 소요시간</th></tr></thead><tbody><tr><td>파일을 연다</td><td>2분</td></tr><tr><td>양식을 확인한다</td><td>5분</td></tr><tr><td>데이터를 복사한다</td><td>10분</td></tr><tr><td>데이터를 붙여넣는다</td><td>5분</td></tr><tr><td>수식을 적용한다</td><td>8분</td></tr><tr><td>합계를 검산한다</td><td>5분</td></tr><tr><td><b>합계</b></td><td><b>35분</b></td></tr></tbody></table></div>`},
      {s:10,n:"10-2",k:"ROLE REDESIGN",t:"역할 재배치 사례 · TO-BE와 개선 효과",c:`
        <div class="grid2"><div class="panel"><h3>TO-BE</h3><ul><li>파일 열기 → AI 자동화</li><li>양식 확인 → AI 자동화 및 단계 제거</li><li>복사·붙여넣기 → AI 자동화</li><li>수식 적용 → AI 자동화</li><li>검산 → AI 처리 후 사람이 2분간 확인</li></ul></div><div class="panel blue"><h3>개선 효과</h3><ul><li>기존: 사람 35분</li><li>개선: AI 3분 + 사람 2분</li><li>총 5분으로 단축</li><li>약 <b>86% 시간 절감</b></li></ul></div></div>
        <div class="grid2" style="margin-top:12px"><div class="panel sky"><h3>AI 역할</h3><ul><li>파일 수집</li><li>양식 변환</li><li>데이터 통합</li><li>수식·계산</li></ul></div><div class="panel"><h3>사람 역할</h3><ul><li>이상치 원인 판단</li><li>예외 상황 대응</li><li>품질 최종 확인</li></ul></div></div>`},

      {s:11,n:"11-1",k:"DELIVER",t:"실행 · 파일럿과 프로토타입",c:`
        <p class="lead">설계만으로는 변화가 발생하지 않으므로 빠르게 실행하고 검증해야 합니다.</p>
        <div class="grid2"><div class="panel blue"><h3>11.1 파일럿</h3><ul><li>작게 시작</li><li>통제된 환경에서 소규모 실험</li><li>실제 작동 여부 검증</li><li>예상하지 못한 문제 발견</li><li>현장 피드백 수집</li><li>다음 단계 추진을 위한 성공 증거 확보</li></ul></div><div class="panel"><h3>11.2 프로토타입</h3><ul><li>완벽하게 만들기 전에 핵심 아이디어를 빠르게 구현</li><li>동작 방식을 눈으로 확인</li><li>사용자에게 보여주고 피드백 수집</li><li>빠진 기능과 문제점 발견</li><li>비용과 시간을 최소화</li></ul></div></div>`},
      {s:11,n:"11-2",k:"DELIVER",t:"실행 · 스프린트와 반복 개선",c:`
        <div class="grid2"><div class="panel sky"><h3>11.3 스프린트</h3><ul><li>짧은 시간 동안 특정 과제에 집중</li><li>빠른 피드백으로 오류를 조기에 발견</li><li><b>운영 원칙</b><ul><li>시간 고정</li><li>데모 필수</li><li>외부 피드백 필수</li><li>회고 필수</li></ul></li></ul></div><div class="panel"><h3>11.4 반복 개선</h3><ul><li>한 번에 완벽하게 만들지 않음</li><li>작은 실패를 빠르게 경험하고 학습</li><li>피드백을 즉시 반영</li><li>완벽보다 전진을 우선</li><li>반복할 때마다 점진적으로 완성도 향상</li></ul></div></div>`},

      {s:12,n:"12",k:"DEEPEN",t:"내재화(Deepen)",c:`
        <p class="lead">개인의 경험과 배움을 조직의 자산으로 전환하여 변화가 지속되도록 만드는 단계입니다.</p>
        <div class="grid4"><div class="panel blue"><h3>학습 추출</h3><p>경험에서 학습을 추출</p></div><div class="panel"><h3>지식 자산화</h3><p>개인 지식을 조직 지식으로 자산화</p></div><div class="panel sky"><h3>지속 준비</h3><p>변화의 지속 방법 준비</p></div><div class="panel"><h3>역량 구축</h3><p>일회성 프로젝트가 아닌 지속적인 조직 역량 구축</p></div></div>
        <h3 style="margin-top:14px">핵심 메시지</h3><ul><li>AX는 기술이 아니라 <b>접근 방식</b></li><li>한 번의 프로젝트로 끝나는 것이 아님</li><li>조직이 계속 학습하고 변화하는 역량을 갖추는 것이 목표</li></ul>`},

      {s:13,n:"13",k:"LESSONS LEARNED",t:"Lessons Learned · 내용 구성과 작성 조건",c:`
        <p class="lead">다른 사람이 읽고 바로 적용할 수 있는 형태로 경험을 문서화합니다.</p>
        <div class="content-section"><h3>13.1 내용 구성</h3><div class="grid4"><div class="panel blue"><h3>제목</h3></div><div class="panel"><h3>카테고리</h3></div><div class="panel sky"><h3>상황</h3></div><div class="panel"><h3>배운 점</h3></div><div class="panel"><h3>권장 행동</h3></div><div class="panel sky"><h3>주의사항</h3></div><div class="panel"><h3>근거</h3></div></div></div>
        <div class="content-section"><h3>13.2 좋은 Lessons Learned의 조건</h3><div class="grid4"><div class="panel blue"><h3>1. 맥락이 있음 Context</h3><p class="bad">나쁜 예: “협업이 중요하다.”</p><p>좋은 예: “AI 프롬프트 작성 시 현업 담당자와 함께 작업한다.”</p></div><div class="panel"><h3>2. 구체적임 Specific</h3><p class="bad">나쁜 예: “소통을 잘해야 한다.”</p><p class="good">좋은 예: “매일 15분 스탠드업 미팅을 진행한다.”</p></div><div class="panel sky"><h3>3. 검증됨 Validated</h3><p class="bad">나쁜 예: “이렇게 하면 좋을 것 같다.”</p><p class="good">좋은 예: “파일럿에서 업무시간 80% 단축을 확인했다.”</p></div><div class="panel"><h3>4. 적용 조건이 있음 Applicable</h3><p class="bad">나쁜 예: “항상 이렇게 해야 한다.”</p><p class="good">좋은 예: “반복 업무 자동화 시 적용한다.”</p></div></div></div>`}
    ];

    const main=document.getElementById('main');
    cards.forEach((x,i)=>{const p=document.createElement('section');p.className='page';p.id=`card-${i+1}`;p.dataset.section=x.s;p.innerHTML=`<article class="card" tabindex="0" role="button" aria-label="${x.t}. 클릭하면 다음 카드로 이동합니다"><header class="head"><div class="num">${x.n}</div><div><div class="kicker">${x.k}</div><h2>${x.t}</h2></div><div class="count">${String(i+1).padStart(2,'0')} / ${cards.length}</div></header><div class="body">${x.c}</div><footer class="foot"><span>카드를 클릭하면 다음 내용으로 이동합니다</span><span class="down">↓</span></footer></article>`;main.appendChild(p)});
    const pages=[...document.querySelectorAll('.page')],toc=document.getElementById('toc');
    sectionTitles.forEach((t,i)=>{
      const first=pages.find(p=>Number(p.dataset.section)===i+1);
      if(!first)return;
      const a=document.createElement('a');
      a.href=`#${first.id}`;
      a.dataset.section=i+1;
      a.dataset.pageIndex=String(pages.indexOf(first));
      a.innerHTML=`<span class="toc-no">${String(i+1).padStart(2,'0')}</span><span>${t}</span>`;
      toc.appendChild(a);
    });
    const links=[...toc.querySelectorAll('a')],bar=document.getElementById('bar'),progressText=document.getElementById('progressText'),topBtn=document.getElementById('top');
    let currentIndex=0;
    if(links[0])links[0].classList.add('active');
    function go(i){if(pages[i])pages[i].scrollIntoView({behavior:'smooth',block:'start'})}
    // <base href="/contents/"> 때문에 #card 해시 링크가 깨지므로 JS로 이동
    links.forEach(a=>{
      a.addEventListener('click',e=>{
        e.preventDefault();
        e.stopPropagation();
        const idx=Number(a.dataset.pageIndex);
        if(Number.isFinite(idx)&&idx>=0)go(idx);
      });
    });
    pages.forEach((p,i)=>{const card=p.querySelector('.card');card.addEventListener('click',e=>{if(e.target.closest('a,button')||window.getSelection().toString().trim())return;go(i+1)});card.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go(i+1)}})});
    const updateNavigation=i=>{if(i<0||i>=pages.length)return;currentIndex=i;const s=Number(pages[i].dataset.section);links.forEach(a=>a.classList.toggle('active',Number(a.dataset.section)===s));const activeLink=links.find(a=>Number(a.dataset.section)===s);if(activeLink)activeLink.scrollIntoView({block:'nearest',inline:'nearest'});progressText.textContent=`${String(i+1).padStart(2,'0')} / ${cards.length}`;bar.style.width=`${(i+1)/cards.length*100}%`;topBtn.classList.toggle('show',i>1);document.title=`${cards[i].n} · ${cards[i].t} | AX Framework`};
    if('IntersectionObserver' in window){const obs=new IntersectionObserver(es=>{const v=es.filter(e=>e.isIntersecting).sort((a,b)=>b.intersectionRatio-a.intersectionRatio)[0];if(v)updateNavigation(pages.indexOf(v.target))},{threshold:[.35,.55,.75]});pages.forEach(p=>obs.observe(p))}else{window.addEventListener('scroll',()=>{let nearest=0,best=Infinity;pages.forEach((p,i)=>{const distance=Math.abs(p.getBoundingClientRect().top);if(distance<best){best=distance;nearest=i}});updateNavigation(nearest)},{passive:true})}
    document.addEventListener('keydown',e=>{if(e.target.closest('input,textarea,select'))return;if((e.key==='ArrowDown'||e.key==='PageDown')&&currentIndex<pages.length-1){e.preventDefault();go(currentIndex+1)}if((e.key==='ArrowUp'||e.key==='PageUp')&&currentIndex>0){e.preventDefault();go(currentIndex-1)}});topBtn.addEventListener('click',()=>go(0));
  </script>
</body>
