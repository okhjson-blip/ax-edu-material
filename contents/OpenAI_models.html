<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OpenAI 최신 모델 이해</title>
<style>
:root{
  --primary:#1F3BB3;
  --primary-dark:#102766;
  --primary-light:#EEF2FC;
  --accent:#86C832;
  --accent-light:#f7fee7;
  --text-dark:#1D1D1F;
  --text-muted:#6E6E73;
  --bg-white:#FFFFFF;
  --border-color:#E5E5EA;
  --panel:#F4F7FB;
  --line:#DCE2EC;
  --sidebar-width:280px;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{
  width:100%;height:100%;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",sans-serif;
  color:var(--text-dark);
  background:#F8F9FA;
  font-size:12pt;
  line-height:1.5;
  overflow:hidden;
}
#app{
  display:flex;
  width:100%;
  height:100vh;
  height:100dvh;
  overflow:hidden;
}
#sidebar{
  width:var(--sidebar-width);
  flex-shrink:0;
  height:100%;
  background:#0f172a;
  color:#fff;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  user-select:none;
}
.progress-header{padding:20px 18px;flex:0 0 auto;}
.sidebar-brand{
  color:#fff;
  font-size:clamp(17px,1.2vw,21px);
  font-weight:850;
  line-height:1.3;
  letter-spacing:-.02em;
  margin-bottom:14px;
}
.sidebar-brand span{
  display:block;
  margin-top:4px;
  color:rgba(255,255,255,.62);
  font-size:11px;
  font-weight:650;
  letter-spacing:.08em;
}
.progress-title{
  font-size:11pt;
  margin-bottom:8px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
#progress-track,.progress-track{
  width:100%;
  height:8px;
  background:rgba(255,255,255,.25);
  border-radius:4px;
  overflow:hidden;
  margin-bottom:6px;
}
#progress-fill,.progress-fill{
  height:100%;
  width:0%;
  background:var(--accent);
  border-radius:4px;
  transition:width .3s ease;
}
.progress-text{
  font-size:9.5pt;
  color:rgba(255,255,255,.85);
  display:flex;
  justify-content:space-between;
}
#agenda-scroll{
  flex:1;
  min-height:0;
  overflow-y:auto;
  padding:12px 0;
}
#agenda-scroll::-webkit-scrollbar{width:6px;}
#agenda-scroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,.25);border-radius:3px;}
.agenda-item{
  display:flex;
  gap:8px;
  align-items:center;
  padding:8px 18px;
  cursor:pointer;
  font-size:11pt;
  color:rgba(255,255,255,.74);
  line-height:1.35;
  transition:background .15s ease,color .15s ease;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.agenda-item:hover{background:rgba(255,255,255,.09);color:#fff;}
.agenda-item.active{background:var(--text-muted);color:#fff;font-weight:400;}
.agenda-num{flex:0 0 auto;min-width:22px;font-size:9.5pt;opacity:.78;}
.agenda-label{flex:1;overflow:hidden;text-overflow:ellipsis;}
.sidebar-home{
  flex:0 0 auto;
  display:flex;
  align-items:center;
  gap:10px;
  min-height:52px;
  padding:13px 18px;
  border-top:1px solid rgba(255,255,255,.12);
  color:rgba(255,255,255,.84);
  font-size:13px;
  text-decoration:none;
  transition:background-color .15s ease,color .15s ease;
}
.sidebar-home:hover,
.sidebar-home:focus-visible{color:#fff;background:rgba(255,255,255,.09);outline:none;}
.sidebar-home::before{content:"←";color:#a3e635;font-size:18px;line-height:1;}
#main{
  flex:1;
  min-width:0;
  height:100%;
  background:#F4F6F9;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:24px;
  overflow:hidden;
  cursor:pointer;
}
#slide-card{
  width:100%;
  max-width:min(1280px, calc((100dvh - 88px) * 1.7778));
  aspect-ratio:16 / 9;
  max-height:calc(100dvh - 88px);
  min-height:0;
  background:var(--bg-white);
  border:1px solid #DCE2EC;
  border-radius:10px;
  box-shadow:0 5px 18px rgba(16,39,102,.08);
  padding:clamp(24px,3.5vh,40px) clamp(28px,3.8vw,56px);
  overflow-y:auto;
  cursor:default;
}
#slide-card.compact{padding:18px 28px 14px;line-height:1.38;}
#slide-card.compact .slide-title{font-size:20pt;margin-bottom:4px;}
#slide-card.compact .slide-sub{margin-bottom:6px;}
#slide-card.compact .slide-body p{margin-bottom:6px;}
#slide-card.compact .callout,
#slide-card.compact .quote-box{padding:8px 12px;margin:6px 0;}
#slide-card.compact table.data-table{margin:6px 0;font-size:11pt;}
#slide-card.compact table.data-table th,
#slide-card.compact table.data-table td{padding:4px 8px;}
#slide-card.compact .flow{gap:2px;margin:6px 0;}
#slide-card.compact .step{padding:5px 10px;}
#slide-card.compact .mini-card{padding:8px 10px;}
#slide-card.compact .orgchart{gap:3px;margin:6px 0;}
#slide-card.compact .two-col,
#slide-card.compact .card-grid{margin:6px 0;gap:10px;}
#slide-card.compact-2{padding:14px 22px 10px;line-height:1.28;}
#slide-card.compact-2 .slide-title{font-size:17pt;margin-bottom:2px;}
#slide-card.compact-2 .slide-sub{margin-bottom:4px;font-size:11.5pt;}
#slide-card.compact-2 .slide-body p{margin-bottom:4px;}
#slide-card.compact-2 .callout,
#slide-card.compact-2 .quote-box{padding:6px 10px;margin:4px 0;font-size:11.5pt;}
#slide-card.compact-2 table.data-table{margin:4px 0;font-size:10.5pt;}
#slide-card.compact-2 table.data-table th,
#slide-card.compact-2 table.data-table td{padding:3px 6px;}
#slide-card.compact-2 .flow{gap:0;margin:4px 0;}
#slide-card.compact-2 .step{padding:3px 10px;font-size:11pt;}
#slide-card.compact-2 .arrow-down,
#slide-card.compact-2 .arrow-right{font-size:11pt;line-height:1;}
#slide-card.compact-2 .mini-card{padding:6px 8px;}
#slide-card.compact-2 .orgchart{gap:2px;margin:4px 0;}
#slide-card.compact-2 .two-col,
#slide-card.compact-2 .card-grid{margin:4px 0;gap:8px;}
#slide-card::-webkit-scrollbar{width:6px;}
#slide-card::-webkit-scrollbar-thumb{background:#D6DEEC;border-radius:3px;}
.slide-kicker{
  font-size:clamp(11px,.76vw,13px);
  font-weight:800;
  letter-spacing:1.15px;
  color:var(--primary);
  text-transform:uppercase;
  margin-bottom:8px;
}
.slide-title{
  font-size:clamp(24px,2.05vw,34px);
  font-weight:800;
  color:var(--primary-dark);
  line-height:1.22;
  margin-bottom:6px;
}
.slide-sub{
  font-size:clamp(14px,1vw,17px);
  color:var(--text-muted);
  margin-bottom:14px;
  line-height:1.45;
}
.badge-practice{
  display:inline-block;
  background:var(--accent);
  color:#fff;
  font-size:10pt;
  font-weight:700;
  padding:4px 12px;
  border-radius:20px;
  margin-bottom:12px;
}
.slide-body{font-size:12pt;color:var(--text-dark);}
.slide-body p{margin-bottom:12px;}
.slide-body strong{color:var(--primary-dark);}
#footer-hint{
  flex:0 0 auto;
  margin-top:10px;
  font-size:11pt;
  color:var(--text-muted);
  display:flex;
  align-items:center;
  gap:6px;
  cursor:default;
}
#footer-hint .key{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:4px;
  padding:1px 7px;
  font-size:10.5pt;
  color:var(--primary-dark);
  font-weight:700;
}
.callout{
  border-left:4px solid var(--accent);
  background:var(--accent-light);
  border-radius:8px;
  padding:10px 14px;
  font-size:12pt;
  color:var(--primary-dark);
  margin:14.4px 0;
}
.callout.info{border-left-color:var(--primary);background:var(--primary-light);}
.quote-box{
  border-left:4px solid var(--accent);
  background:var(--panel);
  border-radius:10px;
  padding:14px 18px;
  font-size:13pt;
  font-weight:700;
  color:var(--primary-dark);
  line-height:1.5;
  margin:14.4px 0;
}
table.data-table{
  width:100%;
  border-collapse:collapse;
  font-size:11.5pt;
  margin:14.4px 0;
}
table.data-table th{
  background:var(--primary-dark);
  color:#fff;
  padding:8px 10px;
  text-align:left;
  font-weight:700;
}
table.data-table td{
  padding:7px 10px;
  border-bottom:1px solid var(--line);
  color:var(--text-dark);
}
table.data-table tr:nth-child(even) td{background:var(--panel);}
table.data-table td.num{text-align:right;font-variant-numeric:tabular-nums;}
table.data-table td.hl{color:var(--accent);font-weight:800;}
table.data-table td.strong-cell{font-weight:700;color:var(--primary-dark);}
.table-note{font-size:11pt;color:var(--text-muted);margin-top:-6px;margin-bottom:12px;}
.flow{display:flex;flex-direction:column;align-items:center;gap:4px;margin:14.4px 0;}
.flow-h{display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap;margin:14.4px 0;}
.step{
  background:var(--panel);
  border:1px solid #C9D6EA;
  border-left:4px solid var(--primary);
  border-radius:8px;
  padding:8px 16px;
  font-size:12pt;
  font-weight:400;
  color:var(--primary-dark);
  text-align:center;
  min-width:110px;
}
.step.accent{border-left-color:var(--accent);background:var(--accent-light);}
.step.dim{border-left-color:#AEB8CC;color:var(--text-muted);font-weight:400;}
.step.small{font-size:11pt;padding:5px 10px;min-width:80px;}
.arrow-down{color:var(--primary);font-size:12pt;font-weight:700;line-height:1;}
.arrow-right{color:var(--primary);font-size:12pt;font-weight:700;}
.branch-row{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin:6px 0;}
.branch-col{display:flex;flex-direction:column;align-items:center;gap:4px;}
.branch-tag{font-size:10.5pt;color:var(--text-muted);font-weight:700;}
.two-col{display:flex;gap:20px;margin:14.4px 0;}
.two-col > div{flex:1;min-width:0;}
.col-title{font-size:12pt;font-weight:800;color:var(--primary-dark);margin-bottom:8px;text-align:center;}
.card-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:14.4px 0;}
.card-grid.cols-4{grid-template-columns:repeat(4,1fr);}
.mini-card{
  border:1px solid var(--line);
  border-top:4px solid var(--primary);
  border-radius:10px;
  padding:12px 14px;
  background:var(--bg-white);
}
.mini-card.green{border-top-color:var(--accent);}
.mini-card h4{font-size:12pt;color:var(--primary-dark);margin-bottom:6px;font-weight:800;}
.mini-card ul{padding-left:16px;font-size:11.5pt;color:var(--text-dark);}
.mini-card ul li{margin-bottom:3px;}
.mini-card p{font-size:11.5pt;color:var(--text-dark);}
ul.plain{padding-left:18px;}
ul.plain li{margin-bottom:7.2px;}
.stars{color:var(--primary);letter-spacing:1px;font-size:12pt;}
.role-org{display:flex;flex-direction:column;align-items:center;gap:4px;margin:12px 0;}
.role-org .lbl{font-size:11pt;color:var(--text-muted);}
.role-org .val{font-size:12pt;font-weight:800;color:var(--primary-dark);}
.indent-line{display:block;padding-left:1.6em;}
.orgchart{display:flex;flex-direction:column;align-items:center;gap:6px;margin:14.4px 0;}
.org-tier{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;}
.org-box{
  background:var(--panel);
  border:1px solid #C9D6EA;
  border-left:4px solid var(--primary);
  border-radius:8px;
  padding:8px 14px;
  font-size:11.5pt;
  font-weight:700;
  color:var(--primary-dark);
  text-align:center;
}
.org-box.top{border-left-color:var(--primary-dark);font-size:12pt;}
.org-box.infra{border-left-color:var(--accent);background:var(--accent-light);font-size:11pt;font-weight:600;}
.cover-meta{font-size:12pt;color:var(--text-muted);margin-bottom:7.2px;}
.cover-meta b{color:var(--primary-dark);}
@media (max-width:900px){
  #app{flex-direction:column;height:auto;min-height:100dvh;}
  body{height:auto;min-height:100dvh;overflow:auto;}
  #sidebar{width:100%;height:auto;}
  #agenda-scroll,.sidebar-home{display:none;}
  #main{padding:10px;overflow:visible;}
  #slide-card{aspect-ratio:auto;max-height:none;min-height:calc(100dvh - 160px);}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;}
}

</style>
</head>
<body>

<div id="app">
  <aside id="sidebar">
    <div class="progress-header">
      <div class="sidebar-brand">
        OpenAI 최신 모델 이해
        <span>MODEL &amp; CODING AGENT</span>
      </div>
      <div class="progress-title">
        <span>학습 진행률</span>
        <span id="progress-percent">0%</span>
      </div>
      <div id="progress-track"><div id="progress-fill"></div></div>
      <div class="progress-text">
        <span>OpenAI 모델 가이드</span>
        <span id="progress-count">1 / 26</span>
      </div>
    </div>
    <nav id="agenda-scroll"></nav>
    <a class="sidebar-home" href="/" target="_top" aria-label="교육 자료 목록으로 이동">목록으로</a>
  </aside>

  <main id="main">
    <div id="slide-card"></div>
    <div id="footer-hint">화면을 클릭하면 다음 페이지로 이동합니다&nbsp;&nbsp;·&nbsp;&nbsp;<span class="key">←</span><span class="key">→</span> 방향키로 이동</div>
  </main>
</div>

<script>
(function(){
  "use strict";

  /* ---------- small render helpers (재사용을 위한 유틸) ---------- */
  function table(headers, rows, numCols){
    numCols = numCols || [];
    var h = '<table class="data-table"><thead><tr>' +
      headers.map(function(x){return '<th>'+x+'</th>';}).join('') +
      '</tr></thead><tbody>';
    rows.forEach(function(r){
      h += '<tr>' + r.map(function(cell, i){
        var cls = numCols.indexOf(i) > -1 ? ' class="num"' : '';
        return '<td'+cls+'>'+cell+'</td>';
      }).join('') + '</tr>';
    });
    h += '</tbody></table>';
    return h;
  }

  function stars(n){
    var full = '★'.repeat(n), empty = '☆'.repeat(5-n);
    return '<span class="stars">'+full+'<span style="color:#C9D6EA">'+empty+'</span></span>';
  }

  function flowV(steps){
    var h = '<div class="flow">';
    steps.forEach(function(s, i){
      var cls = 'step' + (s.accent ? ' accent' : '') + (s.dim ? ' dim' : '');
      h += '<div class="'+cls+'">'+s.t+'</div>';
      if(i < steps.length-1) h += '<div class="arrow-down">↓</div>';
    });
    h += '</div>';
    return h;
  }

  function flowH(steps){
    var h = '<div class="flow-h">';
    steps.forEach(function(s, i){
      var cls = 'step small' + (s.accent ? ' accent' : '') + (s.dim ? ' dim' : '');
      h += '<div class="'+cls+'">'+s.t+'</div>';
      if(i < steps.length-1) h += '<div class="arrow-right">→</div>';
    });
    h += '</div>';
    return h;
  }

  /* ---------- slide content data (내용 수정 시 이 배열만 편집) ---------- */
  var slides = [

  // 0. Cover
  {
    kicker: 'Education Material',
    title: 'OpenAI 최신 모델 이해와 적용 가이드',
    sub: '생성형 AI / LLM / AI Agent를 업무 또는 개발에 활용하려는 사용자 및 개발자를 위한 교육자료',
    agenda: '들어가며',
    body: '' +
      '<div class="cover-meta">🎯 목표 &nbsp;&nbsp;<b>OpenAI 주요 모델의 구조적 차이, 비용, 활용 전략을 이해한다.</b></div>' +
      '<div class="callout info" style="margin-top:24px;">본 자료는 GPT-6 Astra · GPT-5.6 Sol · GPT-5.6 Terra · GPT-5.6 Luna · GPT-5.5<br>5개 모델을 중심으로 구성되어 있습니다.</div>'
  },

  // 1. 섹션1
  {
    kicker:'Section 01', title:'OpenAI 모델을 어떻게 이해해야 하는가?',
    agenda:'모델을 이해하는 새로운 관점',
    body:''+
      '<p>최근의 OpenAI 모델은 단순히 아래와 같은 구조로만 동작하는 Chatbot이라고 보기 어렵습니다.</p>'+
      flowH([{t:'사용자 질문'},{t:'LLM'},{t:'답변'}])+
      '<p style="text-align:center;color:var(--text-sub);font-size:11.5pt;margin:4px 0 16px;">과거의 단순 Chatbot 구조</p>'+
      '<p>최신 모델은 <strong>추론(Reasoning)</strong>과 <strong>외부 도구 사용</strong>을 결합하여 다음과 같은 형태로 발전하고 있습니다.</p>'+
      flowV([{t:'사용자 요청'},{t:'문제 이해'},{t:'계획 / Reasoning'},{t:'필요한 Tool 선택'},{t:'검색 / 파일 / 코드 / Terminal / Computer',accent:true},{t:'중간 결과 분석'},{t:'추가 작업 → 검증'},{t:'최종 결과',accent:true}])+
      '<div class="quote-box">최신 LLM은 점차 <u>답변 생성 모델</u>에서 <u>작업 수행 Agent</u>로 발전하고 있습니다.</div>'+
      '<p style="font-size:11.5pt;color:var(--text-sub);">GPT-6 Astra와 GPT-5.6 계열은 Functions, Web Search, File Search, Computer Use 등의 도구를 지원하며,<br>복잡한 전문 업무와 Agent workflow를 주요 사용 사례로 합니다.</p>'
  },

  // 2. 섹션2
  {
    kicker:'Section 02', title:'현재 주요 OpenAI 모델',
    sub:'교육 목적상 다음 5개 모델을 중심으로 비교합니다.',
    agenda:'현재 주요 OpenAI 모델 5종',
    body:''+
      table(['모델','포지션','대표 사용 목적'],[
        ['<span class="strong-cell">GPT-6 Astra</span>','최상위 Frontier Model','최고난도 추론, Coding Agent, Computer Use'],
        ['<span class="strong-cell">GPT-5.6 Sol</span>','주력 Flagship','전문 업무, 코딩, Agent'],
        ['<span class="strong-cell">GPT-5.6 Terra</span>','가격/성능 균형','기업 업무 자동화, 대량 Agent'],
        ['<span class="strong-cell">GPT-5.6 Luna</span>','초저비용 / 고속','분류, 요약, 대량 처리'],
        ['<span class="strong-cell">GPT-5.5</span>','이전 세대 Flagship','기존 시스템 및 호환성'],
      ])+
      '<div class="callout">OpenAI는 현재 <strong>복잡한 추론과 코딩에는 GPT-6 Astra</strong>,<br>'+
      '<strong>가격과 지능의 균형에는 GPT-5.6 Terra</strong>,<br>'+
      '<strong>대량 저비용 workload에는 GPT-5.6 Luna</strong>를 주요 선택지로 안내하고 있습니다.</div>'
  },

  // 3. 섹션3
  {
    kicker:'Section 03', title:'주요 모델 종합 비교',
    sub:'가격은 100만 tokens당 USD 기준입니다.',
    agenda:'모델 종합 비교 (가격/스펙)',
    body:''+
      table(['모델','Context','최대 Output','Reasoning','Input','Cached','Output'],[
        ['<b>GPT-6 Astra</b>','1.05M','128K','Low ~ Max','$10','$1','$50'],
        ['<b>GPT-5.6 Sol</b>','1.05M','128K','None ~ Max','$4','$0.40','$20'],
        ['<b>GPT-5.6 Terra</b>','1.05M','128K','None ~ Max','$2','$0.20','$12'],

  // 22. 섹션22 - 품질/비용 추천
  {
    kicker:'Section 22', title:'품질과 비용에 따른 추천',
    agenda:'품질/비용별 모델 추천',
    body:''+
      '<div class="card-grid">'+
        '<div class="mini-card"><h4>최고 품질 우선 — GPT-6 Astra</h4><ul>'+
          '<li>중요 시스템</li><li>복잡한 Coding Agent</li><li>Architecture</li>'+
          '<li>자동 Debugging</li><li>대규모 Refactoring</li><li>높은 실패 비용 업무</li>'+

          '<li>일반 기업 Coding Agent</li><li>개발 자동화</li><li>Data 분석</li>'+

        '<div class="mini-card green"><h4>대량 자동화 — GPT-5.6 Terra</h4><ul>'+
          '<li>기업 전체 Agent</li><li>대량 문서 처리</li><li>RAG</li>'+

      flowV([

        {t:'Luna = High-volume Simple Worker',accent:true}
      ])+
      '<div class="quote-box">"Sol 기본 + Astra Escalation/Review" 구조가 품질과 비용의 균형이 가장 좋습니다.</div>'

  {

    agenda:'핵심 정리 (Q&A)',
    body:''+
      '<div style="font-size:11.5pt;">'+
      table(['질문','답'],[
        ['가장 강력한 모델?','<b>GPT-6 Astra</b>'],

        ['Context Window란?','모델이 한 작업에서 참고할 수 있는 전체 정보 공간'],
        ['Max Output이란?','한 응답에서 생성 가능한 최대 길이'],
        ['Parameter란?','학습된 Neural Network의 가중치'],
        ['Parameter 수가 중요한가?','참고 요소지만, 실제 성능·비용·Tool 능력이 더 중요'],
        ['Coding Agent 품질 최우선?','<b>GPT-6 Astra</b>'],
        ['Coding Agent 비용 효율?','<b>GPT-5.6 Sol</b>'],
        ['기업용 추천 구조?','<b>Sol Default + Astra Escalation + Terra/Luna Worker</b>'],
      ])+
      '</div>'

  // 25. 섹션25 - 마지막 한 문장
  {
    kicker:'Section 25', title:'기억해야 할 한 문장',
    agenda:'기억해야 할 한 문장',
    body:''+
      '<div class="quote-box" style="font-size:13pt;">좋은 AI 시스템은 가장 강력한 모델 하나를 사용하는 시스템이 아니라,<br>'+
      '업무 난이도에 따라 적절한 모델과 Reasoning 수준을 선택하는 시스템입니다.</div>'+
      '<p style="margin-top:16px;">Coding Agent에서는 이를 한 단계 더 확장하여:</p>'+
      '<div class="quote-box" style="font-size:13pt;">Model + Reasoning + Tool + Verification + Routing을<br>'+
      '함께 설계해야 높은 자동화와 품질을 동시에 확보할 수 있습니다.</div>'
  },

  ];

  /* ---------- state & DOM cache ---------- */
  var state = { index: 0, total: slides.length };
  var dom = {
    card: document.getElementById('slide-card'),
    agenda: document.getElementById('agenda-scroll'),
    progressFill: document.getElementById('progress-fill'),
    progressPercent: document.getElementById('progress-percent'),
    progressCount: document.getElementById('progress-count'),
    main: document.getElementById('main')
  };
  var agendaItemEls = [];

  /* ---------- build agenda once ---------- */
  function buildAgenda(){
    var html = '';
    slides.forEach(function(s, i){
      var num = (i).toString().padStart(2,'0');
      html += '<div class="agenda-item" data-index="'+i+'">' +
                '<span class="agenda-num">'+num+'</span>' +
                '<span class="agenda-label">'+s.agenda+'</span>' +
              '</div>';
    });
    dom.agenda.innerHTML = html;
    agendaItemEls = Array.prototype.slice.call(dom.agenda.querySelectorAll('.agenda-item'));
  }

  /* ---------- render current slide ---------- */
  function fitCard(){
    var card = dom.card;
    if (!card) return;
    card.classList.remove('compact', 'compact-2');
    if (card.scrollHeight > card.clientHeight + 1){
      card.classList.add('compact');
    }
    if (card.scrollHeight > card.clientHeight + 1){
      card.classList.add('compact-2');
    }
  }

  function render(){
    var s = slides[state.index];
    var html = '<div class="slide-kicker">'+s.kicker+'</div>' +
               '<h1 class="slide-title">'+s.title+'</h1>' +
               (s.sub ? '<p class="slide-sub">'+s.sub+'</p>' : '') +
               (s.badge ? '<span class="badge-practice">🛠 '+s.badge+'</span>' : '') +
               '<div class="slide-body">'+s.body+'</div>';
    dom.card.classList.remove('compact', 'compact-2');
    dom.card.innerHTML = html;
    dom.card.scrollTop = 0;
    requestAnimationFrame(fitCard);

    // progress
    var percent = Math.round(((state.index+1)/state.total)*100);
    dom.progressFill.style.width = percent+'%';
    dom.progressPercent.textContent = percent+'%';
    dom.progressCount.textContent = (state.index+1)+' / '+state.total;

    // agenda active state + auto scroll into view
    agendaItemEls.forEach(function(el, i){
      if(i === state.index){
        el.classList.add('active');
        el.scrollIntoView({block:'nearest'});
      } else {
        el.classList.remove('active');
      }
    });
  }

  function goTo(i){
    if(i < 0) i = 0;
    if(i > state.total-1) i = state.total-1;
    state.index = i;
    render();
  }
  function next(){ goTo(state.index+1); }
  function prev(){ goTo(state.index-1); }

  /* ---------- interactions ---------- */
  // 메인 스테이지 클릭 → 다음 페이지 (링크 클릭은 제외)
  dom.main.addEventListener('click', function(e){
    if (e.target.closest && e.target.closest('a')) return;
    next();
  });

  // 사이드바 목록 클릭 → 해당 슬라이드로 이동 (Event Delegation, 전파 차단)
  dom.agenda.addEventListener('click', function(e){
    var item = e.target.closest('.agenda-item');
    if(!item) return;
    e.stopPropagation();
    goTo(parseInt(item.getAttribute('data-index'), 10));
  });

  // 키보드 방향키 이동 (사이드바 목록 상하 이동 포함)
  document.addEventListener('keydown', function(e){
    switch(e.key){
      case 'ArrowRight':
      case 'ArrowDown':
      case ' ':
        e.preventDefault();
        next();
        break;
      case 'ArrowLeft':
      case 'ArrowUp':
        e.preventDefault();
        prev();
        break;
      case 'Home':
        e.preventDefault();
        goTo(0);
        break;
      case 'End':
        e.preventDefault();
        goTo(state.total-1);
        break;
    }
  });

  /* ---------- init ---------- */
  window.addEventListener('resize', fitCard);
  buildAgenda();
  render();
})();
</script>
